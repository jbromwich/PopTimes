<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PopTimes">
<meta name="theme-color" content="#e9eef5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta property="og:title" content="PopTimes — times tables games">
<meta property="og:description" content="Two fun games for mastering the times tables. Come play!">
<meta property="og:url" content="https://jbromwich.github.io/PopTimes/">
<meta property="og:image" content="https://jbromwich.github.io/PopTimes/icons/icon-512.png">
<meta property="og:type" content="website">
<title>PopTimes</title>
<style>
:root{
  --page:#e9eef5; --panel:#f2f6fb; --ink:#1e2530; --muted:#5f6b7a;
  --line:#cdd8e6; --line-strong:#a8b7c9; --accent:#2f6ea8;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#15191f; --panel:#1d232c; --ink:#e8edf4; --muted:#94a1b2;
    --line:#2f3843; --line-strong:#4a5765; --accent:#8ab6e0;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--page); color:var(--ink);
  font-family:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
  display:flex; justify-content:center; align-items:flex-start;
  padding:32px 16px calc(24px + env(safe-area-inset-bottom));
}
#app{width:100%;max-width:520px}
h1{font-weight:600;font-size:clamp(38px,11vw,52px);letter-spacing:.5px}
.subtitle{font-size:17px;color:var(--muted);margin:6px 0 32px;line-height:1.4}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:22px}
a.app{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  text-decoration:none;color:var(--ink);-webkit-tap-highlight-color:transparent;
}
.app .ico{
  width:100%;max-width:158px;aspect-ratio:1;border-radius:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(0,0,0,0.22);
  transition:transform .12s ease;
}
a.app:active .ico{transform:scale(.95)}
.app.flash .ico{background:linear-gradient(155deg,#5cabff,#2f6ea8)}
.app.conveyor .ico{background:linear-gradient(155deg,#f2b74e,#d97e2c)}
.app .ico svg{width:52%;height:52%}
.app .nm{margin-top:14px;font-size:21px;font-weight:600;letter-spacing:.2px}
.app .tg{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.35}
#foot{margin-top:52px;text-align:right;font-size:12px;color:var(--muted)}
#foot a{color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <h1>PopTimes</h1>
  <p class="subtitle">Two ways to master your times tables. Pick a game.</p>
  <div class="apps">
    <a class="app flash" href="flash.html">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L5 13h5l-2 9 9-12h-5z" fill="#fff"/></svg></span>
      <span class="nm">Flash</span>
      <span class="tg">Quick-fire quiz.<br>Beat the timer.</span>
    </a>
    <a class="app conveyor" href="conveyor.html">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="3.5" width="11" height="8.5" rx="1.4" fill="#fff"/><path d="M12 3.5v8.5M6.5 7.75h11" stroke="#d97e2c" stroke-width="1.1"/><rect x="3" y="15" width="18" height="2.6" rx="1.3" fill="#fff"/><circle cx="6" cy="20.2" r="1.7" fill="#fff"/><circle cx="12" cy="20.2" r="1.7" fill="#fff"/><circle cx="18" cy="20.2" r="1.7" fill="#fff"/></svg></span>
      <span class="nm">Conveyor</span>
      <span class="tg">Catch the crates<br>on the belt.</span>
    </a>
  </div>
  <div id="foot">by <a href="https://julianbromwich.com" target="_blank" rel="noopener">Julian Bromwich</a> · <a href="https://github.com/jbromwich/poptimes" target="_blank" rel="noopener">github</a></div>
</div>
</body>
</html>
