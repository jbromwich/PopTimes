:root{
  --page:#e9eef5; --panel:#f2f6fb; --ink:#1e2530; --muted:#5f6b7a;
  --line:#cdd8e6; --line-strong:#a8b7c9; --accent:#2f6ea8;
  --ok-bg:#dcefdf; --ok-ink:#22622f; --bad-bg:#f6dcd9; --bad-ink:#95322a; --radius:8px;
  --m0:#93372a; --m50:#d69a3e; --m100:#86cf92; --dot:#8fa3b8;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#15191f; --panel:#1d232c; --ink:#e8edf4; --muted:#94a1b2;
    --line:#2f3843; --line-strong:#4a5765; --accent:#8ab6e0;
    --ok-bg:#1f3d27; --ok-ink:#9fdcae; --bad-bg:#43241f; --bad-ink:#f0a79c;
    --m0:#b4503c; --m50:#d6a04a; --m100:#8ad69c; --dot:#5c6b7d;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  font-size:16px; -webkit-text-size-adjust:100%;
  display:flex; justify-content:center;
  padding:16px 12px calc(16px + env(safe-area-inset-bottom));
}
#app{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:20px 22px 24px}
#head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted);min-height:18px}
#track{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:26px}
#bar{height:100%;width:0;background:var(--accent);transition:width .3s}
#qrow{display:grid;grid-template-columns:1fr;align-items:baseline;font-size:clamp(30px,9vw,40px);margin-bottom:22px;min-height:52px}
#q{text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#qa{text-align:left;padding-left:14px;color:var(--ok-ink);opacity:0;transition:opacity .35s;font-variant-numeric:tabular-nums}
#opts{display:grid;grid-template-columns:1fr;gap:12px;transition:opacity .4s}
#opts button{font-family:inherit;font-size:20px;letter-spacing:.03em;font-variant-numeric:tabular-nums;padding:16px 0;color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .45s,background-color .2s}
#fb{text-align:center;margin-top:20px;font-size:15px;min-height:24px;color:var(--muted)}
#fb .row{font-size:22px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
#fb button{font-family:inherit;font-size:26px;padding:20px 44px;color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius);cursor:pointer}
#right{display:flex;align-items:center;gap:12px}
#quit{display:none;font-family:inherit;font-size:20px;line-height:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:0 2px}
#chart{display:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;line-height:0;-webkit-tap-highlight-color:transparent}
#chart svg{display:block}
#quit:focus-visible,#chart:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.brand{font-family:ui-rounded,'SF Pro Rounded','Atkinson Hyperlegible',system-ui,sans-serif;font-weight:600;font-size:clamp(36px,11vw,50px);letter-spacing:.5px;color:var(--ink)}
.ver{font-size:14px;color:var(--muted);margin-left:8px;vertical-align:middle}
.subtitle{font-size:17px;color:var(--muted);margin-top:4px;line-height:1.4}
#foot{margin-top:44px;text-align:right;font-size:12px;color:var(--muted)}
#foot a{color:var(--muted)}
#fb button.link{border:none;background:none;color:var(--muted);font-size:15px;text-decoration:underline;padding:8px}

/* ---- progress screen ---- */
.pg-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.pg-stat{text-align:center}
.pg-stat .n{font-size:30px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.pg-stat .n.up{color:var(--ok-ink)}
.pg-stat .l{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.07em;text-transform:uppercase;line-height:1.3}
.pg-sec{padding-top:22px}
.pg-sec + .pg-sec{margin-top:22px;border-top:1px solid var(--line)}
.pg-sec h2{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin:0 0 14px}
.pg-grid{display:grid;grid-template-columns:18px repeat(12,1fr);gap:3px}
.pg-grid .ax{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.pg-grid .cell{aspect-ratio:1;border-radius:3px}
.pg-grid .cell.off{border:1px dashed var(--line);background:transparent}
.pg-note{margin-top:14px;font-size:14px;color:var(--ink);line-height:1.5}
.pg-legend{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pg-ramp{height:7px;flex:1;border-radius:4px;background:linear-gradient(90deg,var(--m0),var(--m50),var(--m100))}
.pg-key{display:flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-size:11px;margin-top:10px;color:var(--muted)}
.pg-key i{width:11px;height:11px;border-radius:3px;border:1px dashed var(--line);display:block}
.pg-chart{width:100%;overflow-x:auto}
.pg-chart svg{display:block;width:100%;height:auto}
.pg-foot{margin-top:10px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pg-milestone{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:15px;color:var(--muted)}
.pg-milestone b{color:var(--ink);font-weight:400}
.pg-clear{margin-top:20px;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <div id="head"><span id="prog"></span><span id="right"><span id="score"></span><button id="chart" title="Progress" aria-label="See your progress"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 15V9M9 15V3M15 15v-4"/></svg></button><button id="quit" title="Quit to title" aria-label="Quit to title">&times;</button></span></div>
  <div id="track"><div id="bar"></div></div>
  <div id="qrow"><span id="q">&nbsp;</span><span id="qa"></span></div>
  <div id="opts"></div>
  <div id="fb"></div>
</div>
<script>
var F=[3,4,5,6,7,8,9,12],TOTAL=20,KEY='poptimes-v2',OLDKEY='times-tables-stats',GRACE=2500;
var TARGET=2000,MAXHIST=200;
var q=document.getElementById('q'),qa=document.getElementById('qa'),opts=document.getElementById('opts'),
    fb=document.getElementById('fb'),prog=document.getElementById('prog'),sc=document.getElementById('score'),
    bar=document.getElementById('bar'),qrow=document.getElementById('qrow'),track=document.getElementById('track'),
    quit=document.getElementById('quit'),chartBtn=document.getElementById('chart');
quit.addEventListener('click',function(){welcome();});
chartBtn.addEventListener('click',function(){progress();});
var a,b,ans,score=0,n=0,lock=false,t0=0,stats={},hist=[],recent=[],log=[],tick=0,testMs=0;
var PAIRS=[];
for(var i=0;i<F.length;i++)for(var j=i+1;j<F.length;j++)PAIRS.push([F[i],F[j]]);
PAIRS.push([10,11],[11,11],[11,12],[10,12],[12,12]);

function key(x,y){return Math.min(x,y)+'x'+Math.max(x,y)}
function rnd(x){return Math.floor(Math.random()*x)}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function load(){
  try{localStorage.removeItem(OLDKEY);}catch(e){}
  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);stats=o.f||{};hist=o.h||[];}
  }catch(e){stats={};hist=[];}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({f:stats,h:hist}));}catch(e){}}
function hasHistory(){for(var k in stats){return true;}return false;}
function weight(p){
  var s=stats[key(p[0],p[1])];
  if(!s||!s.n)return 4;
  return Math.max(0.5,Math.min(20,(s.t/s.n/1000)*(1+2*(s.w/s.n))));
}
function avgMs(){var t=0,c=0;for(var k in stats){t+=stats[k].t;c+=stats[k].n;}return c?t/c:7000;}
function stepMs(){return Math.max(900,Math.min(3200,avgMs()*0.4));}
function pickPair(){
  var pool=PAIRS.filter(function(p){return recent.indexOf(key(p[0],p[1]))===-1;});
  var src=pool.length?pool:PAIRS;
  var w=src.map(weight),sum=w.reduce(function(x,y){return x+y;},0),r=Math.random()*sum;
  for(var i=0;i<src.length;i++){r-=w[i];if(r<=0)return src[i];}
  return src[0];
}
function alive(){return [].slice.call(opts.children).filter(function(c){return c.style.opacity!=='0';});}
function drop(){
  if(lock)return;
  var wrong=alive().filter(function(c){return +c.textContent!==ans;});
  if(wrong.length<=1){tick=setTimeout(timeup,stepMs());return;}
  var victim=wrong[rnd(wrong.length)];
  victim.style.opacity='0';victim.style.pointerEvents='none';
  tick=setTimeout(wrong.length-1<=1?timeup:drop,stepMs());
}
function timeup(){if(!lock)pick(null,null,true);}
function next(){
  if(n>=TOTAL)return finish();
  lock=false;fb.textContent='';n++;quit.style.display='block';
  qa.textContent='';qa.style.opacity='0';
  opts.style.opacity='1';opts.style.pointerEvents='auto';
  prog.textContent='Question '+n+' of '+TOTAL;
  bar.style.width=Math.round((n-1)/TOTAL*100)+'%';
  var p=pickPair(),k=key(p[0],p[1]),s=stats[k];
  var flip=s&&s.o===0?1:(s?0:rnd(2));
  if(flip){a=p[1];b=p[0];}else{a=p[0];b=p[1];}
  ans=a*b;q.innerHTML='';q.textContent=a+' × '+b;
  recent.push(k);if(recent.length>3)recent.shift();
  var seen={},vals=[ans],g=0;seen[ans]=1;
  while(vals.length<6&&g++<300){
    var d=(1+rnd(9))*(Math.random()<0.5?-1:1),v=ans+d;
    if(v>0&&!seen[v]){seen[v]=1;vals.push(v);}
  }
  for(var z=vals.length-1;z>0;z--){var r2=rnd(z+1),tmp=vals[z];vals[z]=vals[r2];vals[r2]=tmp;}
  opts.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';
  opts.innerHTML='';
  vals.forEach(function(v){
    var btn=document.createElement('button');
    btn.textContent=v;
    btn.addEventListener('mousedown',function(e){e.preventDefault();});
    btn.addEventListener('click',function(){pick(v,btn,false);});
    opts.appendChild(btn);
  });
  clearTimeout(tick);
  tick=setTimeout(drop,GRACE+stepMs());
  t0=Date.now();
}
function pick(v,btn,timedOut){
  if(lock)return;lock=true;clearTimeout(tick);
  var el=Date.now()-t0,k=key(a,b),ok=!timedOut&&v===ans,maxT=GRACE+5*stepMs();
  var spent=ok?Math.min(el,maxT):maxT;
  var s=stats[k]||(stats[k]={t:0,n:0,w:0,o:0});
  s.t+=spent;s.n++;if(!ok)s.w++;s.o=(a<b)?0:1;
  testMs+=spent;
  if(ok){
    score++;
    btn.style.background='var(--ok-bg)';btn.style.color='var(--ok-ink)';
    qa.textContent='= '+ans;qa.style.opacity='1';
  } else {
    log.push({q:a+' × '+b,ans:ans});
    if(btn){btn.style.background='var(--bad-bg)';btn.style.color='var(--bad-ink)';}
    setTimeout(function(){
      opts.style.opacity='0';opts.style.pointerEvents='none';
      qa.textContent='= '+ans;qa.style.opacity='1';
    },timedOut?0:450);
  }
  sc.textContent='Score '+score;
  bar.style.width=Math.round(n/TOTAL*100)+'%';
  save();
  setTimeout(next,ok?1400:2900);
}
function bigBtn(label,fn){
  var btn=document.createElement('button');
  btn.textContent=label;btn.addEventListener('click',fn);return btn;
}
function linkBtn(label,fn){
  var btn=document.createElement('button');
  btn.className='link';btn.textContent=label;btn.addEventListener('click',fn);return btn;
}
function chrome(showQuit,showChart){
  quit.style.display=showQuit?'block':'none';
  chartBtn.style.display=(showChart&&hist.length)?'block':'none';
}
function reset(){
  track.style.display='';qrow.style.display='';
  score=0;n=0;recent=[];log=[];testMs=0;sc.textContent='Score 0';
  chrome(true,false);
  fb.innerHTML='';fb.style.textAlign='center';
  qrow.style.gridTemplateColumns='1fr 1fr';q.style.textAlign='right';
  next();
}
function welcome(){
  clearTimeout(tick);lock=true;
  prog.textContent='';sc.textContent='';bar.style.width='0';
  track.style.display='none';qrow.style.display='';
  chrome(false,true);
  qrow.style.gridTemplateColumns='1fr';q.style.textAlign='center';
  q.innerHTML='<span class="brand">PopTimes</span><span class="ver">1.1</span><div class="subtitle">times tables quiz</div>';
  qa.textContent='';qa.style.opacity='0';
  opts.innerHTML='';opts.style.opacity='1';
  fb.innerHTML='';fb.style.textAlign='center';
  fb.appendChild(bigBtn(hasHistory()?'Continue Quiz':'Start',reset));
  var t=document.createElement('div');
  t.style.cssText='font-size:16px;color:var(--muted);line-height:1.6;margin-top:22px;';
  t.innerHTML='Tap the correct answer<br>before the time runs out.';
  fb.appendChild(t);
  var foot=document.createElement('div');
  foot.id='foot';
  foot.innerHTML='by <a href="https://julianbromwich.com" target="_blank" rel="noopener">Julian Bromwich</a>';
  fb.appendChild(foot);
}
function wipe(){
  try{localStorage.removeItem(KEY);}catch(e){}
  stats={};hist=[];welcome();
}
function finish(){
  var pct=Math.round(score/TOTAL*100);
  var msg=pct>=90?'Excellent':pct>=70?'Good work':pct>=50?'Getting there':'Keep practising';
  clearTimeout(tick);
  hist.push({d:dayKey(new Date()),c:score,t:Math.round(testMs),n:TOTAL});
  if(hist.length>MAXHIST)hist=hist.slice(-MAXHIST);
  save();
  prog.textContent='';sc.textContent='';track.style.display='none';qrow.style.display='';
  chrome(false,true);
  qrow.style.gridTemplateColumns='1fr';q.style.textAlign='center';
  q.innerHTML='';q.textContent=score+' / '+TOTAL+'  ('+pct+'%)';qa.textContent='';qa.style.opacity='0';
  opts.innerHTML='';opts.style.opacity='1';
  fb.innerHTML='';fb.style.textAlign='left';
  var p=document.createElement('div');
  p.style.cssText='font-size:22px;color:var(--ink);margin-bottom:22px;text-align:center;';
  p.textContent=msg+'!';
  fb.appendChild(p);
  if(!log.length){
    var d=document.createElement('div');
    d.style.cssText='font-size:18px;text-align:center;color:var(--ok-ink);';
    d.textContent='Nothing missed this round';
    fb.appendChild(d);
  } else {
    var h=document.createElement('div');
    h.style.cssText='font-size:16px;color:var(--muted);margin-bottom:8px;';
    h.textContent='Keep working on these:';
    fb.appendChild(h);
    log.forEach(function(r){
      var row=document.createElement('div');
      row.className='row';row.textContent=r.q+' = '+r.ans;
      fb.appendChild(row);
    });
  }
  var wrap=document.createElement('div');
  wrap.style.cssText='text-align:center;margin-top:22px;';
  wrap.appendChild(bigBtn('Continue Quiz',reset));
  fb.appendChild(wrap);
  var lw=document.createElement('div');
  lw.style.cssText='text-align:center;margin-top:14px;';
  lw.appendChild(linkBtn('See your progress',progress));
  fb.appendChild(lw);
}

/* ---------- progress ---------- */
function pad(x){return x<10?'0'+x:''+x}
function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function popScore(r){
  var acc=r.c/r.n, speed=clamp(Math.sqrt(TARGET/(r.t/r.n)),0.5,1.2);
  return 100*acc*speed;
}
function mastery(s){
  var acc=1-s.w/s.n, speed=clamp(Math.sqrt(TARGET/(s.t/s.n)),0.4,1.15);
  var raw=clamp(acc*speed,0,1), conf=s.n/(s.n+2);
  return 0.5+(raw-0.5)*conf;
}
function dayStreak(){
  if(!hist.length)return 0;
  var days={};hist.forEach(function(r){days[r.d]=1;});
  var d=new Date(),s=0;
  if(!days[dayKey(d)]){d.setDate(d.getDate()-1);if(!days[dayKey(d)])return 0;}
  while(days[dayKey(d)]){s++;d.setDate(d.getDate()-1);}
  return s;
}
function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function makeRamp(){
  var a=hex2rgb(cssVar('--m0')),b=hex2rgb(cssVar('--m50')),c=hex2rgb(cssVar('--m100'));
  return function(m){
    var lo,hi,f;
    if(m<0.5){lo=a;hi=b;f=m/0.5;}else{lo=b;hi=c;f=(m-0.5)/0.5;}
    return 'rgb('+lo.map(function(v,i){return Math.round(v+(hi[i]-v)*f);}).join(',')+')';
  };
}
function el(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;
  return e;
}
function statCell(value,label,up){
  var d=el('div','pg-stat'),v=el('div','n'+(up?' up':''),value);
  d.appendChild(v);d.appendChild(el('div','l',label));
  return d;
}
function buildGrid(){
  var g=el('div','pg-grid'),ramp=makeRamp();
  g.appendChild(el('div','ax'));
  for(var c=1;c<=12;c++)g.appendChild(el('div','ax',c));
  for(var r=1;r<=12;r++){
    g.appendChild(el('div','ax',r));
    for(var c2=1;c2<=12;c2++){
      var s=stats[key(r,c2)],cell=el('div','cell'+(s&&s.n?'':' off'));
      if(s&&s.n){
        cell.style.background=ramp(mastery(s));
        cell.title=r+' × '+c2+' — '+(s.n-s.w)+'/'+s.n+' right, '+(s.t/s.n/1000).toFixed(1)+'s average';
      } else {
        cell.title=r+' × '+c2+' — not asked yet';
      }
      g.appendChild(cell);
    }
  }
  return g;
}
function weakest(){
  var by={};
  for(var k in stats){
    if(!stats[k].n)continue;
    var m=mastery(stats[k]);
    k.split('x').forEach(function(f){(by[f]=by[f]||[]).push(m);});
  }
  var list=Object.keys(by).map(function(f){
    var arr=by[f];
    return {f:+f,m:arr.reduce(function(x,y){return x+y;},0)/arr.length};
  });
  list.sort(function(x,y){return x.m-y.m;});
  return list.slice(0,2).map(function(o){return o.f;}).sort(function(x,y){return x-y;});
}
function buildChart(){
  var wrap=el('div','pg-chart');
  var scores=hist.map(popScore);
  var W=476,H=190,PL=6,PR=6,PT=22,PB=14,maxY=130;
  var last=scores.length-1;
  var x=function(i){return scores.length<2?W/2:PL+(W-PL-PR)*i/(scores.length-1);};
  var y=function(v){return PT+(H-PT-PB)*(1-clamp(v,0,maxY)/maxY);};
  var line=cssVar('--line'),muted=cssVar('--muted'),accent=cssVar('--accent'),dot=cssVar('--dot'),ink=cssVar('--ink');
  var s='';
  s+='<line x1="'+PL+'" y1="'+y(100)+'" x2="'+(W-PR)+'" y2="'+y(100)+'" stroke="'+line+'" stroke-width="1" stroke-dasharray="3 4"/>';
  s+='<text x="'+PL+'" y="'+(y(100)-6)+'" font-size="10" fill="'+muted+'">100</text>';
  if(scores.length>=3){
    var sm=scores.map(function(_,i){
      var arr=scores.slice(Math.max(0,i-2),i+1);
      return arr.reduce(function(p,q2){return p+q2;},0)/arr.length;
    });
    var path='M '+x(0)+' '+y(sm[0]);
    sm.forEach(function(v,i){if(i)path+=' L '+x(i)+' '+y(v);});
    s+='<path d="'+path+' L '+x(last)+' '+(H-PB)+' L '+x(0)+' '+(H-PB)+' Z" fill="'+accent+'" opacity="0.10"/>';
    s+='<path d="'+path+'" fill="none" stroke="'+accent+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  scores.forEach(function(v,i){
    s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="2.5" fill="'+dot+'"/>';
  });
  s+='<circle cx="'+x(last)+'" cy="'+y(scores[last])+'" r="5" fill="'+accent+'"/>';
  s+='<text x="'+(x(last)-10)+'" y="'+(y(scores[last])-10)+'" text-anchor="end" font-size="15" fill="'+ink+'">'+Math.round(scores[last])+'</text>';
  wrap.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Score across '+
    scores.length+' test'+(scores.length===1?'':'s')+', latest '+Math.round(scores[last])+'">'+s+'</svg>';
  return wrap;
}
function progress(){
  clearTimeout(tick);lock=true;
  prog.textContent='Progress';sc.textContent='';
  track.style.display='none';qrow.style.display='none';
  chrome(true,false);
  opts.innerHTML='';opts.style.opacity='1';
  qa.textContent='';qa.style.opacity='0';
  fb.innerHTML='';fb.style.textAlign='left';

  var scores=hist.map(popScore);
  var best=scores.length?Math.round(Math.max.apply(null,scores)):0;
  var delta=scores.length>1?Math.round(scores[scores.length-1]-scores[0]):null;

  var row=el('div','pg-stats');
  row.appendChild(statCell(hist.length,'Tests'));
  row.appendChild(statCell(best,'Best'));
  row.appendChild(statCell(dayStreak(),'Day streak'));
  row.appendChild(statCell(delta===null?'–':(delta>0?'+':'')+delta,'Since start',delta>0));
  fb.appendChild(row);

  var s1=el('div','pg-sec');
  s1.appendChild(el('h2',null,'Times table'));
  s1.appendChild(buildGrid());
  var w=weakest();
  if(hist.length>=3&&w.length===2)s1.appendChild(el('p','pg-note','Your '+w[0]+'s and '+w[1]+'s need the most work.'));
  var lg=el('div','pg-legend');
  lg.appendChild(el('span',null,'Needs work'));
  lg.appendChild(el('span','pg-ramp'));
  lg.appendChild(el('span',null,'Mastered'));
  s1.appendChild(lg);
  var kk=el('div','pg-key');
  kk.appendChild(el('i'));kk.appendChild(el('span',null,'Not asked in this quiz'));
  s1.appendChild(kk);
  fb.appendChild(s1);

  var s2=el('div','pg-sec');
  s2.appendChild(el('h2',null,'Improvement'));
  if(hist.length>=2)s2.appendChild(buildChart());
  if(hist.length<3){
    s2.appendChild(el('p','pg-note',hist.length===1
      ? 'Your first test is in. Two more and your progress line starts.'
      : 'One more test and your progress line starts.'));
  } else {
    var f=el('div','pg-foot');
    f.appendChild(el('span',null,'First test'));
    f.appendChild(el('span',null,'Today'));
    s2.appendChild(f);
  }
  fb.appendChild(s2);

  var ms=el('p','pg-milestone');
  if(best<100){
    ms.innerHTML='<b>'+(100-best)+' points</b> to your first 100';
  } else {
    ms.innerHTML='Personal best <b>'+best+'</b> — keep it up';
  }
  fb.appendChild(ms);

  var cw=el('div','pg-clear');
  cw.appendChild(linkBtn('Clear my history',function(){
    if(confirm('Clear all your progress? This cannot be undone.'))wipe();
  }));
  fb.appendChild(cw);
}
load();
welcome();
</script>
</body>
</html>
