:root{
  --page:#e9eef5; --panel:#f2f6fb; --ink:#1e2530; --muted:#5f6b7a;
  --line:#cdd8e6; --line-strong:#a8b7c9; --accent:#2f6ea8;
  --ok-bg:#dcefdf; --ok-ink:#22622f; --bad-bg:#f6dcd9; --bad-ink:#95322a; --radius:8px;
  --m0:#93372a; --m50:#d69a3e; --m100:#86cf92; --dot:#8fa3b8; --accent2:#7a5ea8;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#15191f; --panel:#1d232c; --ink:#e8edf4; --muted:#94a1b2;
    --line:#2f3843; --line-strong:#4a5765; --accent:#8ab6e0;
    --ok-bg:#1f3d27; --ok-ink:#9fdcae; --bad-bg:#43241f; --bad-ink:#f0a79c;
    --m0:#b4503c; --m50:#d6a04a; --m100:#8ad69c; --dot:#5c6b7d; --accent2:#b9a2e0;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:'Andika',system-ui,-apple-system,sans-serif;
  font-size:16px; -webkit-text-size-adjust:100%;
  display:flex; justify-content:center;
  padding:16px 12px calc(16px + env(safe-area-inset-bottom));
}
#app{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:20px 22px 24px}
#head{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted);min-height:18px}
#qcount{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-variant-numeric:tabular-nums}
#track{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:26px}
#bar{height:100%;width:0;background:var(--accent);transition:width .3s}
#qrow{display:grid;grid-template-columns:1fr;align-items:baseline;font-size:clamp(30px,9vw,40px);margin-bottom:22px;min-height:52px}
#q{text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#qa{text-align:left;padding-left:14px;color:var(--ok-ink);opacity:0;transition:opacity .35s;font-variant-numeric:tabular-nums}
#opts{display:grid;grid-template-columns:1fr;gap:12px;transition:opacity .4s}
#opts button{font-family:inherit;font-size:20px;letter-spacing:.03em;font-variant-numeric:tabular-nums;padding:16px 0;color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .45s,background-color .2s}
#fb{text-align:center;margin-top:20px;font-size:15px;min-height:24px;color:var(--muted)}
#fb .row{font-size:22px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
#fb button{font-family:inherit;font-size:26px;padding:20px 44px;color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius);cursor:pointer}
#right{display:flex;align-items:center;gap:12px}
#quit,#exit{display:none;font-family:inherit;font-size:20px;line-height:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:0 2px;text-decoration:none}
#chart,#share{display:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;line-height:0;-webkit-tap-highlight-color:transparent}
#chart svg,#share svg{display:block}
#quit:focus-visible,#exit:focus-visible,#chart:focus-visible,#share:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.brand{font-family:ui-rounded,'SF Pro Rounded','Andika',system-ui,sans-serif;font-weight:600;font-size:clamp(36px,11vw,50px);letter-spacing:.5px;color:var(--ink)}
.ver{font-size:14px;color:var(--muted);margin-left:8px;vertical-align:middle}
.subtitle{font-size:17px;color:var(--muted);margin-top:4px;line-height:1.4}
#foot{margin-top:44px;text-align:right;font-size:12px;color:var(--muted)}
#foot a{color:var(--muted)}
#fb button.link{border:none;background:none;color:var(--muted);font-size:15px;text-decoration:underline;padding:8px}

/* ---- mode picker ---- */
.modes{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#fb .modes button{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:999px;background:none;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
#fb .modes button span{display:block;font-size:11px;margin-top:2px}
#fb .modes button.sel{color:var(--ink);border-color:var(--accent);border-width:2px;padding:7px 11px}
#fb .modes .mbar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden;position:relative}
#fb .modes .mbar i{display:block;height:100%;border-radius:2px;background:#e8b64c}
#fb .modes .mbar i.done{background:#6cb043}
#fb .modes .mchk{color:#6cb043;font-weight:700;margin-left:4px}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <div id="head"><span id="prog"></span><span id="qcount"></span><span id="right"><span id="score"></span><button id="share" title="Share" aria-label="Share"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v8a1 1 0 001 1h12a1 1 0 001-1v-8"/></svg></button><button id="chart" title="Progress" aria-label="See your progress"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 15V9M9 15V3M15 15v-4"/></svg></button><button id="quit" title="Quit to title" aria-label="Quit to title">&times;</button><a id="exit" href="index.html" title="Back to games" aria-label="Back to games">&times;</a></span></div>
  <div id="track"><div id="bar"></div></div>
  <div id="qrow"><span id="q">&nbsp;</span><span id="qa"></span></div>
  <div id="opts"></div>
  <div id="fb"></div>
</div>
<script src="shared.js?v=13"></script>
<script>
/* Times-tables quiz on the shared PopTimes progression:
   levels are ladder rungs shared with the Loader — pass a test
   (>=90% correct, and never 3 wrong in a row) to advance. */
var MODES={
  beginner:{label:'Student',sub:'easy tables'},
  regular:{label:'Scholar',sub:'all tables'},
  expert:{label:'Master',sub:'hard tables'}
};
/* TESTLEN (questions per level) is shared from shared.js */
var STEPMS={beginner:2600,regular:2100,expert:1700};
var GRACE=2500;
var mode=localStorage.getItem('ml-mode')||localStorage.getItem('poptimes-mode');
if(!MODES[mode])mode='regular';
try{localStorage.removeItem('poptimes-v3');localStorage.removeItem('poptimes-mode');}catch(e){}

var q=document.getElementById('q'),qa=document.getElementById('qa'),opts=document.getElementById('opts'),
    fb=document.getElementById('fb'),prog=document.getElementById('prog'),qcount=document.getElementById('qcount'),sc=document.getElementById('score'),
    bar=document.getElementById('bar'),qrow=document.getElementById('qrow'),track=document.getElementById('track'),
    quit=document.getElementById('quit'),chartBtn=document.getElementById('chart'),
    shareBtn=document.getElementById('share');
quit.addEventListener('click',function(){clearTimeout(tick);welcome();});
chartBtn.addEventListener('click',function(){showProgress();});
shareBtn.addEventListener('click',function(){audio();sTap();shareNow();});

var a,b,ans,level=0,streak=0,recent=[];
var N=0,idx=0,c=0,qc=0,consecW=0,log=[],testT0=0,tables=[];
var lock=false,tick=0,dropped=false,t0=0;

function rnd(x){return Math.floor(Math.random()*x)}
function stepMs(){return STEPMS[mode]}
function chrome(showQuit,showChart){
  quit.style.display=showQuit?'block':'none';
  document.getElementById('exit').style.display=showQuit?'none':'block';
  chartBtn.style.display=(showChart&&(ST.h.length||seenCount()))?'block':'none';
  shareBtn.style.display=showChart?'block':'none';   /* shareable from day one */
}

/* ---------- a test = one ladder level ---------- */
function startRun(){
  level=BESTS[mode]||0;   /* resume at the next uncleared level */
  startTest();
}
function startTest(){
  var rung=ladderRung(mode,level);
  tables=rung.tables;
  N=TESTLEN[mode];idx=0;c=0;qc=0;consecW=0;log=[];recent=[];streak=streak||0;
  testT0=Date.now();
  track.style.display='';qrow.style.display='';
  sc.textContent='Score 0';
  chrome(true,false);
  fb.innerHTML='';fb.style.textAlign='center';
  qrow.style.gridTemplateColumns='1fr 1fr';q.style.textAlign='right';
  next();
}
function next(){
  if(consecW>=3||idx>=N)return finish();
  lock=false;dropped=false;fb.textContent='';idx++;
  quit.style.display='block';document.getElementById('exit').style.display='none';
  qa.textContent='';qa.style.opacity='0';
  opts.style.opacity='1';opts.style.pointerEvents='auto';
  prog.textContent=(level>=LADDER_LEN[mode]?'Practice':'Level '+(level+1)+' of '+LADDER_LEN[mode]);
  qcount.textContent=idx+' / '+N;
  bar.style.width=Math.round((idx-1)/N*100)+'%';
  var f=pickFact({pref:mode,tables:tables,recent:recent});
  a=f.a;b=f.b;ans=a*b;
  recent.push(fkey(a,b));if(recent.length>4)recent.shift();
  q.innerHTML='';q.textContent=a+' \u00d7 '+b;
  var seen={},vals=[ans],g=0;seen[ans]=1;
  while(vals.length<6&&g++<300){
    var d=(1+rnd(9))*(Math.random()<0.5?-1:1),v=ans+d;
    if(v>0&&!seen[v]){seen[v]=1;vals.push(v);}
  }
  for(var z=vals.length-1;z>0;z--){var r2=rnd(z+1),tmp=vals[z];vals[z]=vals[r2];vals[r2]=tmp;}
  opts.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';
  opts.innerHTML='';
  vals.forEach(function(v){
    var btn=document.createElement('button');
    btn.textContent=v;
    btn.addEventListener('mousedown',function(e){e.preventDefault();});
    btn.addEventListener('click',function(){pick(v,btn,false);});
    opts.appendChild(btn);
  });
  clearTimeout(tick);
  tick=setTimeout(drop,GRACE+stepMs());
  t0=Date.now();
}
function alive(){return [].slice.call(opts.children).filter(function(x){return x.style.opacity!=='0';});}
function drop(){
  if(lock)return;
  var wrong=alive().filter(function(x){return +x.textContent!==ans;});
  if(wrong.length<=1){tick=setTimeout(timeup,stepMs());return;}
  var victim=wrong[rnd(wrong.length)];
  victim.style.opacity='0';victim.style.pointerEvents='none';dropped=true;
  tick=setTimeout(wrong.length-1<=1?timeup:drop,stepMs());
}
function timeup(){if(!lock)pick(null,null,true);}
function pick(v,btn,timedOut){
  if(lock)return;lock=true;clearTimeout(tick);
  var ok=!timedOut&&v===ans;
  var wasQuick=ok&&!dropped;   /* quick = answered before options started dropping */
  audio(); if(ok)sGood();else sWrong();
  recordOutcome(a,b, ok?(wasQuick?'q':'c'):'w');
  if(ok){
    c++;if(wasQuick)qc++;streak++;noteStreak(streak);consecW=0;
    notePace(Date.now()-t0);   /* quiz questions are always multiplying */
    if(btn){btn.style.background='var(--ok-bg)';btn.style.color='var(--ok-ink)';}
    qa.textContent='= '+ans;qa.style.opacity='1';
  }else{
    streak=0;consecW++;
    log.push({q:a+' \u00d7 '+b,ans:ans});
    if(btn){btn.style.background='var(--bad-bg)';btn.style.color='var(--bad-ink)';}
    /* reveal the answer only if you never answered (timeout), or the
       fact is still new; known facts you're expected to retrieve \u2014
       the end-of-test recap always shows every missed answer anyway */
    var reveal=timedOut||factWin(a,b).m<MASTER_MIN;
    setTimeout(function(){
      opts.style.opacity='0';opts.style.pointerEvents='none';
      if(reveal){qa.textContent='= '+ans;qa.style.opacity='1';}
    },timedOut?0:450);
  }
  sc.textContent='Score '+c;
  bar.style.width=Math.round(idx/N*100)+'%';
  setTimeout(next,ok?1200:2600);
}
function finish(){
  var NEXTMODE={beginner:'regular',regular:'expert'};
  var brokeDown=consecW>=3;
  var n=Math.max(1,idx);
  var practice=level>=LADDER_LEN[mode];
  var need=gateNeeded(mode,level,n);
  var passed=!brokeDown&&c>=need.needC&&qc>=need.needQ;
  var grad=false;
  noteLevelResult(
    {d:dayKey(new Date()),c:c,n:n,q:qc,lv:level+1,m:mode},
    passed?{dur:Date.now()-testT0}:undefined);
  if(!practice&&passed&&level+1>(BESTS[mode]||0)){
    BESTS[mode]=level+1;saveBest(mode);
    if(isGraduated(mode)){
      grad=true;
      celebrate(mode==='beginner'?1:mode==='regular'?2:3);
    }
  }
  if(passed&&!grad)sWin();
  prog.textContent='';qcount.textContent='';sc.textContent='';track.style.display='none';
  chrome(false,true);
  qrow.style.gridTemplateColumns='1fr';q.style.textAlign='center';
  q.innerHTML='';q.textContent=c+' / '+n;
  qa.textContent='';qa.style.opacity='0';
  opts.innerHTML='';opts.style.opacity='1';
  fb.innerHTML='';fb.style.textAlign='left';
  var p=document.createElement('div');
  p.style.cssText='font-size:22px;color:var(--ink);margin-bottom:8px;text-align:center;';
  p.textContent=grad?('You’re now a '+GRAD_TITLE[mode]+'!')
    :practice?(passed?'Great practice!':'Practice done!')
    :passed?('Level '+(level+1)+' passed!'):('Level '+(level+1)+' not passed yet');
  fb.appendChild(p);
  if(grad){
    var perf=ST.h.filter(function(r){return r.m===mode&&r.n>0&&r.c===r.n;}).length;
    var gl=document.createElement('div');
    gl.style.cssText='font-size:14px;color:var(--muted);margin-bottom:16px;text-align:center;';
    gl.textContent='All '+LADDER_LEN[mode]+' levels cleared \u00b7 '+perf+' perfect \u00b7 best streak '+(ST.rec.streak||0);
    fb.appendChild(gl);
  }else{
    /* gate bars: fill = your answers, tick = the gate; green past the
       tick, amber short of it, darker track below the tick */
    var chk=document.createElement('div');
    chk.style.cssText='margin:2px 6px 16px;';
    var okC=c>=need.needC, okQ=qc>=need.needQ;
    chk.innerHTML=gateBarRow('Correct',c,n,need.needC)+gateBarRow('Quick',qc,n,need.needQ);
    fb.appendChild(chk);
    var sub=document.createElement('div');
    sub.style.cssText='font-size:14px;color:var(--muted);margin-bottom:20px;text-align:center;';
    sub.textContent=brokeDown?'Three wrong in a row ends the level.'
      :practice?'':(passed?'On to the next one.':(okC?'Answer faster to move up.':'Answer more accurately to move up.'));
    fb.appendChild(sub);
  }
  var wrap=document.createElement('div');
  wrap.style.cssText='text-align:center;margin-top:22px;display:flex;flex-direction:column;gap:12px;align-items:center;';
  if(grad&&NEXTMODE[mode]){
    wrap.appendChild(bigBtn('Continue as '+GRAD_TITLE[mode],function(){
      mode=NEXTMODE[mode];
      try{localStorage.setItem('ml-mode',mode);}catch(e){}
      startRun();
    }));
  }
  if(grad||practice){
    wrap.appendChild(bigBtn('Keep practising',function(){
      level=LADDER_LEN[mode];   /* practice holds at the final rung */
      startTest();
    }));
  }else{
    wrap.appendChild(bigBtn(passed?'Next level':'Try again',function(){
      if(passed)level++;
      startTest();
    }));
  }
  fb.appendChild(wrap);
  var lw=document.createElement('div');
  lw.style.cssText='text-align:center;margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center;';
  if(grad){
    var gradMode=mode;
    lw.appendChild(iconBtn('Share the news','share',function(){shareNow(gradShareInfo(gradMode));}));
  }
  lw.appendChild(iconBtn('See your progress','chart',function(){showProgress();}));
  fb.appendChild(lw);
  /* missed recap last, below the buttons, two equations per row —
     buttons never shift with the number of misses */
  if(!grad){
    if(!log.length){
      var d=document.createElement('div');
      d.style.cssText='font-size:18px;text-align:center;color:var(--ok-ink);margin-top:24px;';
      d.textContent='Nothing missed this round';
      fb.appendChild(d);
    }else{
      var h=document.createElement('div');
      h.style.cssText='font-size:16px;color:var(--muted);margin:24px 0 8px;text-align:center;';
      h.textContent='Keep working on these:';
      fb.appendChild(h);
      var gridw=document.createElement('div');
      gridw.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;text-align:center;';
      log.forEach(function(r){
        var row=document.createElement('div');
        row.style.cssText='font-size:20px;padding:8px 0;color:var(--ink);font-variant-numeric:tabular-nums;';
        row.textContent=r.q+' = '+r.ans;
        if(log.length%2===1&&r===log[log.length-1])row.style.gridColumn='1 / -1';
        gridw.appendChild(row);
      });
      fb.appendChild(gridw);
    }
  }
  awardNewMedals(grad?1600:450);
}
function gateBarRow(label,val,n,need){
  var ok=val>=need;
  var tick=Math.round(need/Math.max(1,n)*100);
  var w=Math.round(Math.min(1,val/Math.max(1,n))*100);
  return '<div style="margin:12px 0;">'
    +'<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:5px;">'
      +'<span>'+label+'</span><span style="color:var(--ink);font-variant-numeric:tabular-nums;">'+val+' / '+n+'</span></div>'
    +'<div style="position:relative;height:10px;border-radius:5px;background:var(--line);">'
      +(ok?'':'<div style="position:absolute;left:0;top:0;bottom:0;width:'+tick+'%;border-radius:5px 0 0 5px;background:rgba(0,0,0,0.15);"></div>')
      +'<div style="position:absolute;left:0;top:0;bottom:0;width:'+w+'%;border-radius:5px;background:'+(ok?'#6cb043':'#e8b64c')+';"></div>'
      +(ok?'':'<div style="position:absolute;left:calc('+tick+'% - 1px);top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink);opacity:0.75;"></div>')
    +'</div>'
    +(ok?'':'<div style="position:relative;height:14px;"><span style="position:absolute;left:'+tick+'%;transform:translateX(-50%);font-size:11px;color:var(--muted);">'+need+'</span></div>')
    +'</div>';
}
function bigBtn(label,fn){
  var btn=document.createElement('button');
  btn.textContent=label;
  btn.addEventListener('click',function(){audio();sTap();fn();});
  return btn;
}
function linkBtn(label,fn){
  var btn=document.createElement('button');
  btn.className='link';btn.textContent=label;
  btn.addEventListener('click',function(){audio();sTap();fn();});
  return btn;
}
/* secondary pill button with a teaching icon: 'chart' or 'share' */
var BTNICONS={
  chart:'<path d="M3 15V9M9 15V3M15 15v-4"/>',
  share:'<path d="M9 12V3M6 6l3-3 3 3M3 10v6a1 1 0 001 1h10a1 1 0 001-1v-6" transform="translate(0,-1)"/>'
};
function iconBtn(label,icon,fn){
  var btn=document.createElement('button');
  btn.style.cssText='font-family:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;'
    +'padding:9px 18px;border:1.5px solid var(--line-strong);border-radius:999px;background:none;color:var(--muted);cursor:pointer;';
  btn.innerHTML='<svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    +BTNICONS[icon]+'</svg><span>'+label+'</span>';
  btn.addEventListener('click',function(){audio();sTap();fn();});
  return btn;
}
function welcome(){
  clearTimeout(tick);lock=true;
  prog.textContent='';qcount.textContent='';sc.textContent='';bar.style.width='0';
  track.style.display='none';qrow.style.display='';
  chrome(false,true);
  qrow.style.gridTemplateColumns='1fr';q.style.textAlign='center';
  q.innerHTML='<span class="brand">Flash</span><span class="ver">1.15</span><div class="subtitle">a PopTimes quiz · times tables</div>';
  qa.textContent='';qa.style.opacity='0';
  opts.innerHTML='';opts.style.opacity='1';
  fb.innerHTML='';fb.style.textAlign='center';
  fb.appendChild(bigBtn((BESTS[mode]||0)>0?'Continue':'Start',startRun));
  var mrow=document.createElement('div');
  mrow.className='modes';
  Object.keys(MODES).forEach(function(k){
    var btn=document.createElement('button');
    btn.className=k===mode?'sel':'';
    var done=(BESTS[k]||0)>=LADDER_LEN[k];
    var pc=Math.min(1,(BESTS[k]||0)/LADDER_LEN[k]);
    btn.innerHTML=MODES[k].label+(done?'<span class="mchk">\u2713</span>':'')
      +'<span>'+MODES[k].sub+'</span>'
      +'<div class="mbar"><i class="'+(done?'done':'')+'" style="width:'+Math.round(pc*100)+'%"></i></div>';
    btn.addEventListener('click',function(){
      mode=k;
      try{localStorage.setItem('ml-mode',k);}catch(e){}
      welcome();
    });
    mrow.appendChild(btn);
  });
  fb.appendChild(mrow);
  var t=document.createElement('div');
  t.style.cssText='font-size:16px;color:var(--muted);line-height:1.6;margin-top:22px;';
  t.innerHTML='Tap the correct answer<br>before the time runs out.';
  fb.appendChild(t);
  var foot=document.createElement('div');
  foot.id='foot';
  foot.innerHTML='by <a href="https://julianbromwich.com" target="_blank" rel="noopener">Julian Bromwich</a>';
  fb.appendChild(foot);
}
welcome();
window.addEventListener('pageshow',function(e){if(e.persisted)welcome();});
</script>
