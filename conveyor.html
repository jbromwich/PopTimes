<script>
'use strict';
const APPVER = '1.17';   // major = feature, minor = fix
/* ================================================================
   MULTIPLICATION LOADER — cargo-dock theme
   Orders ride a conveyor toward the sea. Tap the crate whose
   rows × columns match the order; the factor strips tile it as
   proof, it shatters, and the pieces pour into the ship's hold.
   ================================================================ */

// surface fatal errors on screen (mobile browsers have no console)
window.addEventListener('error', e=>{
  const d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;background:#a33;color:#fff;font:13px monospace;padding:8px;z-index:9;white-space:pre-wrap';
  d.textContent='Error: '+e.message+' ('+(e.lineno||'?')+')';
  document.body.appendChild(d);
});

// roundRect polyfill for older Android Chrome / WebView
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (w<0){x+=w;w=-w;} if (h<0){y+=h;h=-h;}
    r = Math.max(0, Math.min(typeof r==='number'?r:(Array.isArray(r)?r[0]:0), w/2, h/2));
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  // pin the element to the real visible size — on iOS 100vh overshoots
  // the visible viewport and drawn positions drift away from tap positions
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  cvs.width = W * DPR; cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ---------- layout regions ---------- */
const L = {};              // computed each resize
function layout(){
  L.beltTop   = H * 0.055;                 // conveyor strip
  L.beltY     = H * 0.275;                 // belt surface line (low enough
  L.beltH     = L.beltY - L.beltTop;       //  that a 12x12 product fits above)
  L.fieldTop  = L.beltY + H * 0.02;        // playfield
  L.fieldBot  = H * 0.70;
  L.holdTop   = H * 0.72;                  // ship's hold (container)
  L.holdBot   = H * 0.895;                 // hull continues below into the water
  L.edgeX     = W - W * 0.06;              // dock edge — orders fall here
}

/* ---------- colours ---------- */
const SKY1='#0e2233', SKY2='#183a52', SEA='#0a4a63', SEA2='#0c5b78';
const BELT='#233240', BELT2='#2d4152', BELTLINE='#3d5568';
const CARD='#f4e9d4', CARDINK='#3a2f1e', CARDEDGE='#c9b891';
const INK='#eef4f8', DIM='rgba(238,244,248,0.55)';
const CRATES = [ // [face, top/edge, cell line]
  ['#c98a4b','#a86d36','#8a5527'],
  ['#5fa88a','#488a6e','#356a53'],
  ['#7a8fc9','#5f73aa','#485887'],
  ['#c96a6a','#a85252','#873d3d'],
  ['#b8a04e','#98823a','#78662a'],
  ['#9a6fbd','#7d549e','#613f7d'],
];
const GOOD='#7fe08f', BAD='#ff7a6b', TILE='rgba(255,238,170,0.92)';

/* ---------- helpers ---------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri  = (a,b)=>Math.floor(rnd(a,b+1));
const pick= a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease =t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

/* ================================================================
   GAME STATE
   ================================================================ */
const G = {
  scene: 'menu',        // menu | play | payoff
  phase: 'aim',         // aim | tiling | reveal   (within play)
  level: 0,
  mode: 'multiplying',       // multiplying | factoring
  tables: [],           // times tables in play this level
  combo: 0,
  pace: 0,              // 0..1 escalation
  fill: 0, fillShown: 0, capacity: 100, lvlTotal: 10,
  orders: [],           // conveyor cards, index 0 = frontmost
  cands: [],            // candidate blocks / factor-pair cards
  unit: 16,             // shared unit-cell size this round
  anim: null,           // tiling animation state
  parts: [],            // pour particles
  fx: [],               // floating effects
  splashes: [],
  beltScroll: 0,
  shake: 0,
  payT: 0,
  pref: (m=>['beginner','regular','expert'].includes(m)?m:'regular')(localStorage.getItem('ml-mode')),
  lvlN: 0, lvlC: 0, lvlQ: 0,   // this level's answers: total / correct / quick
  t: 0,
};

function factorMax(){ return 12; }

/* ---------- pacing ---------- */
function orderTravelTime(){                                  // seconds across belt
  // factoring reads slower (product → factor pair), so the belt eases off
  return (16 - 9.5*G.pace) * (G.mode==='factoring' ? 1.15 : 1);
}
function orderSpacing(){ return 0.42 - 0.12*G.pace; }        // fraction of belt between cards
// each level raises the minimum pace — misses ease off, but never below this
function effLevel(){ return Math.min(G.level, LADDER_LEN[G.pref]-1); }   // practice holds at the final rung
function inPractice(){ return G.level >= LADDER_LEN[G.pref]; }
function paceFloor(){ return clamp(0.05 + effLevel()*0.05, 0, 0.7); }
const MISS_LIMIT = 3;   // misses in a row break the conveyor

/* ================================================================
   ORDERS & CANDIDATES
   ================================================================ */
// weakness-weighted fact picking, same formula as the quiz:
// never-asked facts come first, then slow and often-missed ones
// question selection lives in shared.js; the loader adds its
// capacity cap and current focus tables
function newFact(maxP){
  return pickFact({pref:G.pref, tables:G.tables, recent:G.recent, maxP:maxP});
}
// record an outcome and update this level's counters
function recordFact(a,b,res){
  recordOutcome(a,b,res);
  // the badge/record streak spans levels (like the quiz); only a miss
  // resets it. The on-screen combo stays per-ship — separate counter.
  if (res==='w') G.streak = 0;
  else { G.streak = (G.streak||0) + 1; noteStreak(G.streak); }
  G.lvlN++; if(res!=='w')G.lvlC++; if(res==='q')G.lvlQ++;
  // the ship is the level's progress bar: it fills one equal step per
  // resolved question, so it's exactly full on question lvlTotal — the
  // block count of any single crate is purely decorative pour flavour
  G.fill = G.capacity * Math.min(1, G.lvlN / G.lvlTotal);
  if (res==='w' && !(G.lvlLog||[]).some(m=>m.k===fkey(a,b)))
    (G.lvlLog=G.lvlLog||[]).push({k:fkey(a,b), a, b});
}

function spawnOrder(atP){
  // question budget: a level asks exactly lvlTotal DISTINCT questions.
  // Retries (wrong answers riding again) don't count against the
  // budget, so a miss never costs the player a fresh question.
  const fresh = G.orders.reduce((s,o)=>s+(o.retry?0:1), 0);
  if (G.scene==='play' && G.lvlN + fresh >= G.lvlTotal) return;
  let f = newFact();
  // avoid repeating the same product as the order just ahead
  for (let tries=0; tries<8; tries++){
    const prev = G.orders[G.orders.length-1];
    if (!prev || prev.a*prev.b !== f.a*f.b) break;
    const g = newFact(); if (!g) break;
    f.a=g.a; f.b=g.b;
  }
  G.orders.push({a:f.a, b:f.b, p:atP!==undefined?atP:-0.05, state:'ride', st:0,
    col:CRATES[ri(0,CRATES.length-1)]});
  // don't re-ask the same fact for a few orders
  (G.recent=G.recent||[]).push(fkey(f.a,f.b));
  if (G.recent.length>4) G.recent.shift();
}

function nearMisses(a,b){
  const out=[], seen=new Set([a*b]), fmax=factorMax();
  const cand=[[a,b+1],[a,b-1],[a+1,b],[a-1,b],[a+1,b-1],[a-1,b+1],[a+1,b+1],[a-1,b-1],[a,b+2],[a+2,b],[a-2,b],[a,b-2]];
  shuffle(cand);
  for (const [r,c] of cand){
    if (r<1||c<1||r>fmax||c>fmax) continue;
    if (seen.has(r*c)) continue;      // keep product labels unambiguous
    seen.add(r*c); out.push({a:r,b:c});
  }
  // fallback fillers
  while (out.length<5){
    const r=ri(2,fmax), c=ri(2,fmax);
    if (!seen.has(r*c)){ seen.add(r*c); out.push({a:r,b:c}); }
  }
  return out;
}

function buildRound(){
  const o = G.orders[0];
  // pace clock: starts only once the order is readable (p >= 0.32) —
  // if it's still gliding in, the update loop starts it on arrival
  if (o && o !== G.roundFor) G.qT0 = o.p >= 0.32 ? performance.now() : 0;
  G.roundFor = o || null;
  if (!o){ G.cands=[]; return; }
  const n = 4;
  const miss = nearMisses(o.a,o.b).slice(0,n-1);
  const facts = shuffle([{a:o.a,b:o.b,correct:true}, ...miss.map(m=>({a:m.a,b:m.b,correct:false}))]);

  // slot geometry: 2×2 grid in the playfield
  const pad = W*0.035;
  const sw = (W - pad*3)/2, sh = (L.fieldBot - L.fieldTop - pad*3)/2;
  const slots = [];
  for (let i=0;i<n;i++){
    const cx = pad + (i%2)*(sw+pad), cy = L.fieldTop + pad + Math.floor(i/2)*(sh+pad);
    slots.push({x:cx,y:cy,w:sw,h:sh});
  }

  if (G.mode==='multiplying'){
    // one shared unit size so shapes compare honestly
    let u = 1e9;
    const dims = facts.map(f=>{
      let r=f.a, c=f.b;
      if (Math.random()<0.5) [r,c]=[c,r];
      return {r,c};
    });
    facts.forEach((f,i)=>{
      const d=dims[i], s=slots[i];
      u = Math.min(u, (s.w-16)/d.c, (s.h-30)/d.r);
    });
    u = clamp(Math.floor(u), 6, 34);
    G.unit = u;
    G.cands = facts.map((f,i)=>{
      const d=dims[i], s=slots[i];
      const gw=d.c*u, gh=d.r*u;
      return {a:f.a,b:f.b,rows:d.r,cols:d.c,correct:f.correct,
        slot:s, gx:s.x+(s.w-gw)/2, gy:s.y+(s.h-gh)/2, gw, gh,
        col:CRATES[i%CRATES.length], pop:0, wrongT:0, revealT:0, gone:false};
    });
    shuffleColours();
  } else {
    // factoring: candidates are factor-strip pairs
    let u = 1e9;
    facts.forEach((f,i)=>{
      const s=slots[i];
      u = Math.min(u, (s.w-20)/Math.max(f.a,f.b), (s.h-30)/3.4);
    });
    u = clamp(Math.floor(u), 6, 30);
    G.unit = u;
    G.cands = facts.map((f,i)=>{
      const s=slots[i];
      return {a:f.a,b:f.b,correct:f.correct,slot:s,
        col:CRATES[i%CRATES.length], pop:0, wrongT:0, revealT:0, gone:false};
    });
    shuffleColours();
  }
}
function shuffleColours(){
  const cols = shuffle(CRATES.slice());
  G.cands.forEach((c,i)=>c.col=cols[i%cols.length]);
}

/* ================================================================
   FLOW
   ================================================================ */
function startGame(){
  // a cleared level stays cleared: play resumes at the next one
  G.level = BESTS[G.pref]||0;
  G.recent = [];
  startLevel();
  G.scene='play';
}
function startLevel(keepBelt){
  const def = ladderRung(G.pref, G.level);
  G.tables = def.tables;
  G.mode = def.mode;
  G.combo = 0;
  G.missRow = 0;
  G.pace = paceFloor();
  G.fill = 0; G.fillShown = 0;
  G.lvlN = 0; G.lvlC = 0; G.lvlQ = 0;
  G.lvlTotal = TESTLEN[G.pref];   // fixed questions per level (10/15/20)
  G.lvlLog = [];   // facts missed this level, for the completion recap
  G.lvlT0 = performance.now();
  G.capacity = 100;               // nominal hold size; fill is cosmetic now
  G.parts=[]; G.fx=[]; G.anim=null;
  G.phase='aim';
  // between levels the belt keeps rolling: unanswered orders stay and
  // the next level's orders queue up behind them
  if (!keepBelt) G.orders = [];
  if (!G.orders.length) spawnOrder(0.10);
  // the level's first order glides briskly to the readable point,
  // just like the next-up card does after a correct answer
  if (G.orders[0] && G.orders[0].p < 0.30)
    G.orders[0].kv = (0.30 - G.orders[0].p) / 0.2;
  buildRound();
}

function fulfilOrder(){
  G.orders.shift();
  G.combo++;
  G.missRow = 0;
  G.pace = clamp(G.pace + 0.045, paceFloor(), 1);
  // no dead time: the next order must be FULLY on screen and readable —
  // glide it in smoothly (kv decays in update) rather than snapping
  const minP = 0.30;
  if (!G.orders.length){
    spawnOrder(minP);
  } else if (G.orders[0].p < minP){
    G.orders[0].kv = (minP - G.orders[0].p) / 0.2;
  }
  buildRound();
}
function failOrder(keep){
  G.combo = 0;
  G.missRow = (G.missRow||0) + 1;
  G.pace = clamp(G.pace - 0.18, paceFloor(), 1);
  if (G.missRow >= MISS_LIMIT){ breakDown(); return; }
  // fill is progress-driven now (set in recordFact), so a miss doesn't
  // dock cargo — the splash and lost order are penalty enough
}

function retryAfterBreakdown(){
  G.orders=[]; G.parts=[]; G.fx=[]; G.cands=[];
  startLevel(false);
  G.scene='play';
}
function exitBreakdown(){
  G.orders=[]; G.parts=[]; G.fx=[]; G.cands=[];
  G.scene='menu';
}

function breakDown(){
  G.scene='broken'; G.brkT=0; G.shake=1;
  G.anim=null; G.phase='aim';
  if (G.lvlN>0){
    noteLevelResult({d:dayKey(new Date()), c:G.lvlC, n:G.lvlN, q:G.lvlQ, lv:G.level+1, m:G.pref});
  }
  awardNewMedals(1400);   // after the snap; never interrupts play itself
  beep(150,0.4,'sawtooth',0.12); beep(98,0.7,'sawtooth',0.12,0.15); beep(65,1.0,'sawtooth',0.1,0.35);
}

function tapCandidate(c){
  if (G.phase!=='aim' || c.gone) return;
  audio(); sTap();
  const o = G.orders[0]; if (!o) return;
  const ok = c.correct;
  c.pop = 1;
  G.phase = 'tiling';
  o.state = 'held';
  const flyFrom = {x:orderX(o), y:cardY()};
  // for the stats: reaction time, and "quick" = tapped in the belt's first stretch
  // "quick" = answered while the order was still calm (before the wobble)
  G.tapQuick = o.p < 0.66;
  G.tapAt = performance.now();   // for the pace window (multiplying only)

  if (G.mode==='multiplying'){
    // orient the order's strips to the chosen crate
    let tr=o.a, tc=o.b;
    if (c.rows!==tr || c.cols!==tc){
      if (c.rows===tc || c.cols===tr) { tr=o.b; tc=o.a; }
      // still try the better fit for a wrong crate
      const over1 = Math.max(0,o.a-c.rows)+Math.max(0,o.b-c.cols);
      const over2 = Math.max(0,o.b-c.rows)+Math.max(0,o.a-c.cols);
      if (over2<over1){ tr=o.b; tc=o.a; } else { tr=o.a; tc=o.b; }
    }
    G.anim = {cand:c, ok, t:0, tr, tc, oa:o.a, ob:o.b, flyFrom,
      gx:c.gx, gy:c.gy, u:G.unit, rows:c.rows, cols:c.cols,
      fly:0.35, lay:0.30,
      dur: 0.30 + Math.min(0.9, tr*tc*0.02)};
  } else {
    // factoring: prove on a pop-up tray sized to the order (a×b)
    const tr=o.a, tc=o.b;
    const maxW=W*0.66, maxH=(L.fieldBot-L.fieldTop)*0.6;
    const u = clamp(Math.floor(Math.min(maxW/tc, maxH/tr)), 8, 34);
    const gw=tc*u, gh=tr*u;
    const gx=(W-gw)/2, gy=L.fieldTop+((L.fieldBot-L.fieldTop)-gh)/2;
    // chosen pair orientation that best fits the tray
    let cr=c.a, cc=c.b;
    const over1=Math.max(0,c.a-tr)+Math.max(0,c.b-tc);
    const over2=Math.max(0,c.b-tr)+Math.max(0,c.a-tc);
    if (over2<over1){ cr=c.b; cc=c.a; }
    else if (over1===over2 && (c.b===tr||c.a===tc)) { cr=c.b; cc=c.a; }
    G.anim = {cand:c, ok, t:0, tr:cr, tc:cc, oa:o.a, ob:o.b, flyFrom,
      gx, gy, u, rows:tr, cols:tc, tray:true,
      fly:0.35, lay:0.30,
      dur: 0.30 + Math.min(0.9, cr*cc*0.02)};
  }
}

function animCardPos(A){
  // where the flying order card sits/hovers during the proof
  const to = {x:A.gx + A.tc*A.u/2, y:A.gy - Math.max(28, A.u+22)};
  const k = ease(clamp(A.t/A.fly, 0, 1));
  return {x:A.flyFrom.x+(to.x-A.flyFrom.x)*k, y:A.flyFrom.y+(to.y-A.flyFrom.y)*k};
}

function finishTiling(){
  const A = G.anim, o = G.orders[0];
  if (A.ok){
    // a retry (answered wrong earlier) is bonus practice: the crate
    // still loads, but nothing is counted a second time
    if (!o.retry){
      recordFact(o.a, o.b, G.tapQuick ? 'q' : 'c');
      if (G.mode==='multiplying' && G.qT0) notePace(G.tapAt - G.qT0);
    }
    sGood(); sPour();
    // the order card rides down into the hold with its cargo
    const cp = animCardPos(A);
    G.fx.push({kind:'cardDrop', t:0, dur:0.8, x:cp.x, y:cp.y, a:A.oa, b:A.ob});
    // shatter every unit cell into a pour particle
    const u=A.u;
    for (let r=0;r<A.tr;r++) for (let cI=0;cI<A.tc;cI++){
      const px=A.gx+cI*u+u/2, py=A.gy+r*u+u/2;
      G.parts.push({x:px,y:py,vx:rnd(-60,60)+(W*0.5-px)*rnd(0.6,1.4),vy:rnd(-260,-60),
        s:Math.max(4,u*0.42), col:A.cand.col?A.cand.col[0]:'#c98a4b', spin:rnd(-6,6), a:rnd(0,6),
        land:false});
    }
    if (A.cand.slot) A.cand.gone = true;
    fulfilOrder();
    G.anim=null;
    G.phase='aim';
  } else {
    // count the miss once; from here on the order rides as a retry
    if (o && !o.retry) recordFact(o.a, o.b, 'w');
    if (o) o.retry = true;
    sWrong();
    G.shake = 1;
    A.cand.wrongT = 1;
    failOrder(true);
    if (G.scene==='broken'){ G.anim=null; return; }
    // the card flies back to the belt, then tumbles and bumps the queue
    if (o){
      const cp = animCardPos(G.anim);
      o.ret = {fx:cp.x, fy:cp.y, t:0, dur:0.4};
    }
    // highlight the true answer — but only while the fact is still new;
    // once it has real history (practice, Expert) you're expected to know it
    if (o && factWin(o.a,o.b).m < MASTER_MIN){
      const right = G.cands.find(c=>c.correct && !c.gone);
      if (right) right.revealT = 1.4;
    }
    G.phase='reveal';
    G.revealLeft = 1.4;
    G.anim.fade = 1;   // keep drawing the failed tiling while it fades
  }
}

/* ================================================================
   UPDATE
   ================================================================ */
let last = 0;
function frame(ts){
  const dt = Math.min(0.05, (ts-last)/1000 || 0.016);
  last = ts;
  G.t += dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function update(dt){
  // treads scroll at exactly the speed the order cards ride;
  // the line stops while a crate is being loaded (proof animation)
  if (G.scene!=='play' || G.phase==='aim')
    G.beltScroll += dt * (L.edgeX + W*0.22) / orderTravelTime();
  G.shake = Math.max(0, G.shake - dt*3);

  // effects
  G.fx = G.fx.filter(f=>{ f.t+=dt; return f.t<f.dur; });
  G.splashes = G.splashes.filter(s=>{ s.t+=dt; return s.t<0.9; });

  // particles pour toward the hold
  const surfY = pileSurfaceY();
  for (const p of G.parts){
    p.vy += 1900*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.a += p.spin*dt;
    p.vx *= (1-1.6*dt);
    // funnel toward hold mouth
    const mouth = W*0.5;
    if (p.y > L.holdTop-60) p.vx += (mouth-p.x)*2.2*dt;
    if (p.y >= surfY) p.land = true;
  }
  G.parts = G.parts.filter(p=>!p.land);
  // fillShown chases fill smoothly once pieces land / regardless
  const chase = G.parts.length ? 10 : 4;
  G.fillShown += (G.fill - G.fillShown) * Math.min(1, chase*dt);
  if (Math.abs(G.fill-G.fillShown) < 0.3) G.fillShown = G.fill;

  if (G.scene==='broken'){
    G.brkT += dt;   // waits for a tap to dismiss (see pointer handler)
    return;
  }
  if (G.scene==='payoff'){
    G.payT += dt;
    if (G.payT > 3.0){
      // promotion gate: the ship is loaded either way, but moving up
      // demands this level's accuracy and quickness targets.
      // practice rounds (post-graduation) show targets but never gate.
      const n = Math.max(1, G.lvlN);
      const need = gateNeeded(G.pref, G.level, n);
      const passed = G.lvlC >= need.needC && G.lvlQ >= need.needQ;
      G.lvlGate = {passed, n, needC:need.needC, needQ:need.needQ,
                   practice: inPractice(), grad:false};
      if (!G.lvlGate.practice && passed){
        G.level++;
        if (G.level > (BESTS[G.pref]||0)){
          BESTS[G.pref] = G.level; saveBest(G.pref);
          if (isGraduated(G.pref)){          // just crossed the finish line
            G.lvlGate.grad = true;
            celebrate(G.pref==='beginner'?1:G.pref==='regular'?2:3);
          }
        }
        if (!G.lvlGate.grad) sWin();
      } else if (passed){
        sWin();   // practice round that met the targets
      } else {
        sGood();  // the load itself still lands warmly
      }
      G.scene='complete';   // rest point: waits for a tap
      // medal moment: bling in anything newly earned (after the
      // graduation ceremony's opening, when there is one)
      awardNewMedals(G.lvlGate.grad ? 1600 : 450);
    }
    return;
  }
  if (G.scene==='complete') return;   // belt stays frozen until Next level
  if (G.scene!=='play') return;

  // all questions answered → ship tops off and sails (wait for the pour
  // to finish and the hold to visually reach full)
  if (G.lvlN >= G.lvlTotal && G.parts.length===0 && G.phase==='aim'
      && G.fillShown > G.capacity-1){
    // wrong-answer re-asks can leave stragglers queued beyond the
    // budget — the level is done, so the belt empties for the sail
    G.orders=[]; G.cands=[];
    G.scene='payoff'; G.payT=0; sSail();
    noteLevelResult({d:dayKey(new Date()), c:G.lvlC, n:Math.max(1,G.lvlN), q:G.lvlQ, lv:G.level+1, m:G.pref},
      {dur: performance.now() - (G.lvlT0||performance.now())});
    return;
  }

  // conveyor
  const spd = dt / orderTravelTime();
  const held = (G.phase!=='aim');
  // during the proof animation the belt pauses so answering never costs
  // time — except the next-up card, which slides in until fully visible
  // so the player can read it while the animation runs
  const nextUp = !held ? null :
    (G.orders[0] && G.orders[0].state==='held') ? G.orders[1] : G.orders[0];
  for (const o of G.orders){
    if (o.state==='ride'){
      if (!held) o.p += spd;
      else if (o===nextUp && o.p < 0.32) o.p += spd*3;
    }
    o.st += dt;
  }
  // spawn upcoming orders
  const lastO = G.orders[G.orders.length-1];
  if (!lastO || lastO.p > orderSpacing()) {
    if (G.orders.length < 3) spawnOrder();
  }
  // knockback: shoved cards slide back and collide with the queue
  const gap = 0.30;   // ~one card width along the belt
  for (const o of G.orders){
    if (o.kv){
      o.p += o.kv*dt;
      o.kv *= Math.max(0, 1-5*dt);
      if (Math.abs(o.kv) < 0.02) o.kv = 0;
      if (o.p < 0.02){ o.p = 0.02; o.kv = 0; }
    }
    if (o.tumble) o.tumble = Math.max(0, o.tumble - dt*1.6);
    if (o.bump)   o.bump   = Math.max(0, o.bump   - dt*2.5);
  }
  for (let i=1;i<G.orders.length;i++){
    const ahead = G.orders[i-1], me = G.orders[i];
    if (ahead.state==='held' && !ahead.ret) continue;   // off the belt, no slot to collide with
    if (ahead.p - me.p < gap){
      if (!me.bump && (ahead.kv||ahead.bump)) me.bump = 1;   // got hit
      // shove, don't teleport — approach the spacing limit quickly
      const limit = ahead.p - gap;
      me.p += (limit - me.p) * Math.min(1, 14*dt);
    }
  }
  // a new order has reached the front → deal fresh candidates
  if (G.phase==='aim' && G.orders[0] !== G.roundFor) buildRound();
  // the pace clock starts when the front order becomes readable
  if (G.phase==='aim' && !G.qT0 && G.orders[0] && G.orders[0].p >= 0.32)
    G.qT0 = performance.now();
  // expiry: front order falls off the dock
  const front = G.orders[0];
  if (front && front.p >= 1 && G.phase==='aim'){
    if (!front.retry) recordFact(front.a, front.b, 'w');   // retries count nothing
    G.orders.shift();
    sSplash();
    G.splashes.push({x:L.edgeX+14, y:L.beltY+30, t:0, a:front.a, b:front.b,
      crate:G.mode==='factoring', col:front.col||CRATES[0]});
    // never answered → always reveal what it was
    G.fx.push({kind:'float', t:0, dur:2.2, x:L.edgeX-W*0.16, y:L.beltY-34,
      text:front.a+' × '+front.b+' = '+(front.a*front.b), col:INK});
    failOrder(false);
    if (G.scene!=='broken') buildRound();
  }

  // tiling animation (fly in → lay strips → sweep → settle)
  if (G.phase==='tiling' && G.anim){
    const A = G.anim;
    A.t += dt;
    if (A.t >= A.fly + A.lay + A.dur + 0.35) finishTiling();
  }
  // wrong-answer card returning to the belt
  for (const o of G.orders){
    if (o.ret){
      o.ret.t += dt;
      if (o.ret.t >= o.ret.dur){
        o.ret = null;
        o.state = 'ride';
        o.kv = -1.05;      // backward shove along the belt, decays — generous
                           // setback so a miss leaves time to recover
        o.tumble = 1;
      }
    }
  }
  if (G.phase==='reveal'){
    G.revealLeft -= dt;
    if (G.anim){ G.anim.fade -= dt/1.4; }
    for (const c of G.cands) if (c.revealT>0) c.revealT -= dt;
    if (G.revealLeft<=0){ G.anim=null; G.phase='aim'; }
  }
  for (const c of G.cands){
    c.pop = Math.max(0, c.pop - dt*4);
    c.wrongT = Math.max(0, c.wrongT - dt*1.2);
  }
}

/* ================================================================
   DRAW
   ================================================================ */
function orderX(o){ return -W*0.20 + o.p * (L.edgeX + W*0.22); }
function cardY(){ return L.beltTop + L.beltH*0.5; }
function holdGeom(){
  const x0=W*0.14, x1=W*0.86;
  const hx0=x0+16, hx1=x1-16, hTop=L.holdTop+26, hBot=L.holdBot-6;
  const wdt=hx1-hx0, hgt=hBot-hTop;
  const bs=Math.max(5, Math.floor(Math.sqrt(wdt*hgt/Math.max(1,G.capacity))));
  const cols=Math.max(1, Math.floor(wdt/bs));
  return {x0,x1,hx0,hx1,hTop,hBot,bs,cols};
}
function pileSurfaceY(){
  const g=holdGeom();
  return Math.max(g.hTop, g.hBot - (G.fillShown/g.cols)*g.bs);
}

function draw(){
  ctx.save();
  if (G.shake>0){ ctx.translate(rnd(-1,1)*6*G.shake, rnd(-1,1)*6*G.shake); }

  // sky
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,SKY1); sky.addColorStop(1,SKY2);
  ctx.fillStyle=sky; ctx.fillRect(-10,-10,W+20,H+20);

  drawBelt();
  for (const o of G.orders) drawOrder(o);
  drawSplashes();

  if (G.scene==='menu'){ drawMenu(); ctx.restore(); return; }

  drawHUD();
  for (const c of G.cands) drawCandidate(c);
  if (G.anim) drawTiling(G.anim);
  drawHold();
  drawParticles();
  drawFx();
  if (G.scene==='broken') drawBroken();
  if (G.scene==='complete') drawComplete();
  ctx.restore();
}

const NEXTMODE = {beginner:'regular', regular:'expert'};
// display names (MODENAME) and graduation titles (GRAD_TITLE) live in shared.js

function drawComplete(){
  // the completed level's numbers are still in G.lvl* (next level not started)
  const gate = G.lvlGate || {passed:true, n:Math.max(1,G.lvlN), needC:0, needQ:0};
  const lvlNo = gate.passed && !gate.practice ? G.level : G.level+1;
  const missed = gate.grad ? [] : (G.lvlLog||[]).slice(0,4);
  const recRows = Math.ceil(missed.length/2);
  const twoBtns = gate.grad && NEXTMODE[G.pref];
  const bh = clamp(H*0.056,42,52);
  const failHint = !gate.passed && !gate.practice;

  // measure first: walk the layout with a cursor so the card always
  // wraps its content exactly (buttons never shift — recap sits last)
  let y = 70;                                 // heading baseline is 38
  const P = {};
  if (gate.grad){ P.dip1=y+8; P.dip2=y+36; y+=70; }
  else {
    P.bar1=y+4; P.bar2=y+66; y+=128;
    if (failHint){ P.hint=y+12; y+=30; }
    y+=8;
  }
  y+=14;
  if (twoBtns){ P.move=y; y+=bh+14; }
  P.next=y; y+=bh+16;
  if (gate.grad){ P.share=y; y+=46; }
  P.prog=y; y+=36;
  if (missed.length){ P.recH=y+26; P.rec=y+52; y+=26+recRows*26+10; }
  const ph = y+20;
  const y0 = H*0.42 - ph/2;

  ctx.fillStyle='rgba(8,16,24,0.85)';
  rrect(W*0.07, y0, W*0.86, ph, 14); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = gate.passed ? '#6cb043' : '#e8b64c';
  ctx.font='800 '+Math.round(clamp(W*0.062,20,30))+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText(
    gate.grad ? 'You’re now a '+GRAD_TITLE[G.pref]+'!' :
    gate.practice ? (gate.passed ? 'Great practice!' : 'Practice done!') :
    gate.passed ? 'Level '+lvlNo+' complete!' : 'Level '+lvlNo+' not passed yet', W/2, y0+38);
  ctx.font='600 '+Math.round(clamp(W*0.042,14,19))+'px ui-rounded, system-ui, sans-serif';
  if (gate.grad){
    // a personal line for the diploma
    const perf = ST.h.filter(r=>r.m===G.pref && r.n>0 && r.c===r.n).length;
    ctx.fillStyle=INK;
    ctx.fillText('All '+LADDER_LEN[G.pref]+' levels cleared', W/2, y0+P.dip1);
    ctx.fillStyle=DIM;
    ctx.fillText(perf+' perfect · best streak '+(ST.rec.streak||0), W/2, y0+P.dip2);
  } else {
    // promotion gate bars: fill = your answers, tick = the (unmet) gate
    const okC = G.lvlC>=gate.needC;
    gateBar('Correct', G.lvlC, gate.n, gate.needC, y0+P.bar1);
    gateBar('Quick',   G.lvlQ, gate.n, gate.needQ, y0+P.bar2);
    if (failHint){
      ctx.textAlign='center'; ctx.fillStyle=DIM;
      ctx.font='600 '+Math.round(clamp(W*0.042,14,19))+'px ui-rounded, system-ui, sans-serif';
      ctx.fillText(okC ? 'Answer faster to move up.' : 'Answer more accurately to move up.', W/2, y0+P.hint);
    }
  }
  // buttons (fixed position regardless of the recap below)
  const bw=clamp(W*0.56,190,260), bx=(W-bw)/2;
  G.compMove=null;
  if (twoBtns){
    G.compMove={x:bx,y:y0+P.move,w:bw,h:bh};
    ctx.fillStyle='#2f8f5b';
    rrect(bx,y0+P.move,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='800 '+Math.round(bh*0.40)+'px ui-rounded, system-ui, sans-serif';
    ctx.fillText('Continue as '+GRAD_TITLE[G.pref], W/2, y0+P.move+bh/2+1);
  }
  G.compNext={x:bx,y:y0+P.next,w:bw,h:bh};
  ctx.fillStyle = gate.grad ? '#3a6ea5' : (gate.practice||gate.passed) ? '#2f8f5b' : '#a8752f';
  rrect(bx,y0+P.next,bw,bh,bh/2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='800 '+Math.round(bh*0.40)+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText(gate.grad||gate.practice ? 'Keep practising'
    : gate.passed ? 'Next level' : 'Try level '+lvlNo+' again', W/2, y0+P.next+bh/2+1);
  // secondary buttons: share (graduations only) + progress, icon-labelled
  G.compShare = gate.grad ? iconBtn('Share the news','share',y0+P.share) : null;
  G.compProg = iconBtn('See your progress','chart',y0+P.prog);
  // missed recap, two equations per row, at the very bottom
  if (missed.length){
    ctx.font='600 '+Math.round(clamp(W*0.042,14,19))+'px ui-rounded, system-ui, sans-serif';
    ctx.textAlign='center'; ctx.fillStyle=DIM;
    ctx.fillText('Keep working on these:', W/2, y0+P.recH);
    ctx.fillStyle=INK;
    missed.forEach((m,i)=>{
      const lastAlone = (i===missed.length-1) && (missed.length%2===1);
      const x = lastAlone ? W/2 : (i%2===0 ? W/2-W*0.19 : W/2+W*0.19);
      ctx.fillText(m.a+' × '+m.b+' = '+(m.a*m.b), x, y0+P.rec+Math.floor(i/2)*26);
    });
  }
  // in-card exit
  G.compX=cardX(W*0.93-24, y0+24);
}

// one gate-progress row: label + count above, bar with threshold tick below
function gateBar(label, val, n, need, y){
  const x0=W*0.16, bw=W*0.68, bh=10;
  ctx.font='600 '+Math.round(clamp(W*0.038,13,16))+'px ui-rounded, system-ui, sans-serif';
  ctx.textBaseline='middle';
  ctx.textAlign='left';  ctx.fillStyle=DIM; ctx.fillText(label, x0, y);
  ctx.textAlign='right'; ctx.fillStyle=INK; ctx.fillText(val+' / '+n, x0+bw, y);
  const by=y+13, tick=x0+bw*clamp(need/Math.max(1,n),0,1);
  const met = val>=need;
  ctx.fillStyle='rgba(238,244,248,0.16)';
  rrect(x0,by,bw,bh,bh/2); ctx.fill();
  ctx.save();
  rrect(x0,by,bw,bh,bh/2); ctx.clip();
  if (!met){                        // darker track below (left of) the tick
    ctx.fillStyle='rgba(8,16,24,0.45)';
    ctx.fillRect(x0,by,tick-x0,bh);
  }
  const fw=bw*clamp(val/Math.max(1,n),0,1);
  if (fw>0){
    ctx.fillStyle = met ? '#6cb043' : '#e8b64c';
    rrect(x0,by,Math.max(fw,bh),bh,bh/2); ctx.fill();
  }
  ctx.restore();
  if (!met){                        // threshold tick only while unmet,
    ctx.fillStyle='rgba(238,244,248,0.85)';   // labelled underneath like
    ctx.fillRect(tick-1.25, by-3, 2.5, bh+6); // the stats speed bar
    ctx.textAlign='center'; ctx.fillStyle=DIM;
    ctx.font='600 '+Math.round(clamp(W*0.032,11,13))+'px ui-rounded, system-ui, sans-serif';
    ctx.fillText(need, tick, by+bh+12);
  }
  ctx.textAlign='center';
}

// small in-card close cross, top-right; returns its hit rect
function cardX(cx, cy){
  ctx.strokeStyle='rgba(238,244,248,0.55)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx-7,cy-7); ctx.lineTo(cx+7,cy+7);
  ctx.moveTo(cx+7,cy-7); ctx.lineTo(cx-7,cy+7);
  ctx.stroke();
  return {x:cx-22, y:cy-22, w:44, h:44};
}

// secondary pill button with a teaching icon ('chart' or 'share');
// centered at y, returns its hit rect
function iconBtn(label, icon, y){
  ctx.font='700 '+Math.round(clamp(W*0.038,13,16))+'px ui-rounded, system-ui, sans-serif';
  ctx.textBaseline='middle';
  const tw=ctx.measureText(label).width;
  const bh2=36, iw=17, gap=8, pad=16;
  const w=pad+iw+gap+tw+pad, x=(W-w)/2;
  ctx.strokeStyle='rgba(238,244,248,0.45)'; ctx.lineWidth=1.5;
  rrect(x,y,w,bh2,bh2/2); ctx.stroke();
  const ix=x+pad, im=y+bh2/2;
  ctx.strokeStyle='rgba(238,244,248,0.8)'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath();
  if (icon==='chart'){
    ctx.moveTo(ix+2,  im+7); ctx.lineTo(ix+2,  im+1);
    ctx.moveTo(ix+8.5,im+7); ctx.lineTo(ix+8.5,im-7);
    ctx.moveTo(ix+15, im+7); ctx.lineTo(ix+15, im-2);
  } else {   // share: up arrow out of a tray
    ctx.moveTo(ix+8.5,im+1);  ctx.lineTo(ix+8.5,im-8);
    ctx.moveTo(ix+4.5,im-4.5);ctx.lineTo(ix+8.5,im-8.5); ctx.lineTo(ix+12.5,im-4.5);
    ctx.moveTo(ix+2,  im+1);  ctx.lineTo(ix+2,  im+7);  ctx.lineTo(ix+15,im+7); ctx.lineTo(ix+15,im+1);
  }
  ctx.stroke();
  ctx.fillStyle='rgba(238,244,248,0.85)';
  ctx.textAlign='left';
  ctx.fillText(label, ix+iw+gap, im+1);
  ctx.textAlign='center';
  return {x, y, w, h:bh2};
}

function drawBroken(){
  const k = clamp((G.brkT-0.4)/0.4, 0, 1);
  if (k<=0) return;
  ctx.globalAlpha = k;
  ctx.fillStyle='rgba(8,16,24,0.78)';
  const y=H*0.40;
  const cardTop=y-70;
  rrect(W*0.07, cardTop, W*0.86, 236, 14); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=BAD;
  ctx.font='800 '+Math.round(clamp(W*0.075,24,38))+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText('Breakdown!', W/2, y-28);
  ctx.fillStyle=INK;
  ctx.font='600 '+Math.round(clamp(W*0.04,14,19))+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText('Too many missed orders —', W/2, y+12);
  ctx.fillText('the conveyor gave out.', W/2, y+38);
  G.brkBtn=null; G.brkProg=null; G.brkX=null;
  if (G.brkT > 0.8){
    const bw=clamp(W*0.62,210,280), bh=clamp(H*0.056,42,52);
    const bx=(W-bw)/2, by2=y+66;
    G.brkBtn={x:bx,y:by2,w:bw,h:bh};
    ctx.fillStyle='#a8752f';
    rrect(bx,by2,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='800 '+Math.round(bh*0.38)+'px ui-rounded, system-ui, sans-serif';
    ctx.fillText('Try level '+(G.level+1)+' again', W/2, by2+bh/2+1);
    G.brkProg=iconBtn('See your progress','chart',by2+bh+14);
    G.brkX=cardX(W*0.93-24, cardTop+24);
  }
  ctx.globalAlpha = 1;
}

/* ---------- conveyor ---------- */
function drawBelt(){
  const y = L.beltY;
  const brk = G.scene==='broken' ? ease(clamp(G.brkT*1.1,0,1)) : 0;
  if (brk>0){
    const split = W*0.42;
    ctx.fillStyle=BELT;
    rrect(-8, y-10, split+8, 20, 8); ctx.fill();      // left half holds
    ctx.save();                                        // right half gives out
    ctx.translate(split+6, y);
    ctx.rotate(brk*0.38);
    ctx.fillStyle=BELT;
    rrect(0, -10, L.edgeX-split, 20, 8); ctx.fill();
    ctx.restore();
    // sparks at the break
    if (G.brkT<1.6){
      ctx.fillStyle='rgba(255,'+ri(160,220)+',80,'+(0.9-G.brkT*0.5)+')';
      for (let i=0;i<5;i++){
        ctx.beginPath();
        ctx.arc(split+rnd(-6,10), y+rnd(-14,10)+G.brkT*30, rnd(1.5,3.5), 0, 7);
        ctx.fill();
      }
    }
  } else {
    ctx.fillStyle=BELT;
    rrect(-8, y-10, L.edgeX+8, 20, 8); ctx.fill();
    ctx.fillStyle=BELT2;
    rrect(-8, y-10, L.edgeX+8, 8, 6); ctx.fill();
    // moving treads
    ctx.strokeStyle=BELTLINE; ctx.lineWidth=3; ctx.lineCap='round';
    const step=34, off = G.beltScroll % step;
    for (let x=off-step; x<L.edgeX; x+=step){
      ctx.beginPath(); ctx.moveTo(x, y-7); ctx.lineTo(x+10, y+7); ctx.stroke();
    }
  }
  // rollers / legs
  ctx.fillStyle=BELT;
  for (let x=W*0.08; x<L.edgeX-10; x+=W*0.22) ctx.fillRect(x, y+10, 8, H*0.012);
  // dock edge post
  ctx.fillStyle='#31261a';
  ctx.fillRect(L.edgeX-6, y-16, 8, 30);
  ctx.fillStyle='#c9b45a';
  for (let i=0;i<3;i++) ctx.fillRect(L.edgeX-6, y-16+i*10, 8, 5-(i%2)*5+3);
}

/* ---------- order cards ---------- */
function drawOrder(o){
  if (o.state==='held' && !o.ret) return;   // being drawn by the proof animation
  const isFront = o===G.orders[0] && G.scene==='play';
  const cw = Math.min(W*0.30, 148), ch = Math.min(L.beltH*0.98, cw*0.88);
  const isProduct = G.mode==='factoring' && G.scene!=='menu';
  // one shared unit, sized so a 12x12 product fills ~80% of the headroom
  // below the HUD — the biggest product stays big without crowding
  const cu = Math.max(5, Math.floor((L.beltY - H*0.045)*0.8/12));
  // products always ride the belt lying flat (stability: freight travels
  // on its largest face); answer-area orientation stays random
  const cr = Math.min(o.a,o.b), cc2 = Math.max(o.a,o.b);
  const objH = isProduct ? cr*cu : ch;                   // object's real height
  // objects SIT on the belt: bottom edge rests on the belt surface
  let x = orderX(o), y = L.beltY - 6 - objH/2;
  if (o.ret){                               // flying back from the failed crate
    const k = ease(clamp(o.ret.t/o.ret.dur, 0, 1));
    x = o.ret.fx + (x - o.ret.fx)*k;
    y = o.ret.fy + (y - o.ret.fy)*k;
  }
  // wobble near the edge
  const danger = clamp((o.p-0.66)/0.34, 0, 1);
  let tilt = Math.sin(G.t*10+o.a) * 0.10 * danger + (o.p>0.97 ? (o.p-0.97)*8 : 0);
  let lift = 0;
  if (o.tumble){            // shoved backward: hop and roll
    const k = o.tumble;     // 1 → 0
    tilt -= Math.sin(k*Math.PI) * 0.55;
    lift  = -Math.sin(k*Math.PI) * ch*0.35;
  }
  if (o.bump){              // hit by the card in front: jolt
    tilt += Math.sin(o.bump*18) * 0.12 * o.bump;
  }
  if (G.scene==='broken'){  // the belt gave out — cards tumble off
    lift += G.brkT*G.brkT*520;
    tilt += G.brkT*1.6*((o.a+o.b)%2 ? 1 : -1);
  }

  ctx.save();
  ctx.translate(x, y+lift);
  ctx.rotate(tilt);
  ctx.translate(-cw/2, -objH/2);

  if (isProduct){
    // factoring mode: a quantity crate rides the belt — one shared unit
    // size, so a big product is visibly a bigger crate (unit-truthful,
    // exactly like the answer-area crates)
    const u = cu;
    const gw=cc2*u, gh=cr*u, gx=(cw-gw)/2, gy=0;
    drawCrateGrid(gx, gy, cr, cc2, u, o.col||CRATES[0]);
    ctx.lineWidth = isFront ? 3.5 : 0;
    if (isFront){
      ctx.strokeStyle = danger>0.4 ? BAD : '#e8b64c';
      rrect(gx-4, gy-4, gw+8, gh+8, 5); ctx.stroke();
    }
    // product badge, sized like the field crates' (scaled to the belt)
    const label=''+(o.a*o.b);
    const fs = clamp(W*0.055, 18, 28);
    ctx.font='800 '+Math.round(fs)+'px ui-rounded, system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle='rgba(20,16,10,0.55)';
    rrect(cw/2-tw/2-7, gh/2-fs*0.62, tw+14, fs*1.24, 7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label, cw/2, gh/2+fs*0.04);
  } else {
    // fact card
    ctx.fillStyle='rgba(0,0,0,0.25)';
    rrect(3,4,cw,ch,10); ctx.fill();
    ctx.fillStyle=CARD;
    rrect(0,0,cw,ch,10); ctx.fill();
    ctx.lineWidth=isFront?3:1.5;
    ctx.strokeStyle = isFront ? (danger>0.4 ? BAD : '#e8b64c') : CARDEDGE;
    rrect(0,0,cw,ch,10); ctx.stroke();
    drawFactors(cw, ch, o.a, o.b);
  }
  ctx.restore();
}

/* the fact card's face: "a × b" over its two labeled factor strips —
   identical wherever the card appears (conveyor or answer area) */
function drawFactors(cw, ch, a, b){
  const base = Math.min(ch, cw*0.88);
  ctx.fillStyle=CARDINK;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // uniform equation size, chosen so the widest case ("12 × 12") fits
  let fs = base*0.30;
  ctx.font='700 '+Math.round(fs)+'px ui-rounded, system-ui, sans-serif';
  fs *= Math.min(1, cw*0.86/ctx.measureText('12 × 12').width);
  ctx.font='700 '+Math.round(fs)+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText(a+' × '+b, cw/2, ch*0.26);
  strip(ch*0.55, a, '#b0693a');
  strip(ch*0.80, b, '#4a7fae');
  function strip(cy, n, col){
    // no count label — the equation above already names the factors
    const u = Math.min(cw*0.82/n, base*0.16);
    const w = n*u;
    const sx = (cw-w)/2;
    ctx.fillStyle=col;
    for (let i=0;i<n;i++){
      rrect(sx+i*u+0.5, cy-u/2+0.5, u-1, u-1, 2); ctx.fill();
    }
  }
}

function drawSplashes(){
  for (const s of G.splashes){
    const t=s.t/0.9;
    ctx.save();
    ctx.globalAlpha = 1-t;
    ctx.translate(s.x, s.y + t*t*90);
    ctx.rotate(t*2.4);
    if (s.crate){
      // factoring mode: a little crate goes into the sea
      let r=s.a, c=s.b;
      if (r>c) [r,c]=[c,r];
      const u=Math.min(46/c, 32/r);
      for (let rr=0;rr<r;rr++) for (let cc=0;cc<c;cc++)
        cell(-c*u/2+cc*u, -r*u/2+rr*u, u, s.col);
    } else {
      ctx.fillStyle=CARD;
      rrect(-20,-14,40,28,5); ctx.fill();
      ctx.fillStyle=CARDINK;
      ctx.font='700 13px ui-rounded, system-ui, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(s.a+'×'+s.b, 0, 0);
    }
    ctx.restore();
    // droplets
    ctx.fillStyle='rgba(120,200,230,'+(0.7*(1-t))+')';
    for (let i=0;i<5;i++){
      const a=i*1.3, r=10+t*46;
      ctx.beginPath(); ctx.arc(s.x+Math.cos(a)*r*0.6, s.y+8-Math.sin(a)*r*0.5+t*40, 3, 0, 7); ctx.fill();
    }
  }
}

/* ---------- candidates ---------- */
function drawCandidate(c){
  if (c.gone) return;
  const wrongPulse = c.wrongT>0 ? Math.sin(c.wrongT*20)*0.5+0.5 : 0;
  const reveal = c.revealT>0;
  ctx.save();
  const pop = 1 + c.pop*0.05;
  const cx = c.slot.x + c.slot.w/2, cy = c.slot.y + c.slot.h/2;
  ctx.translate(cx, cy); ctx.scale(pop, pop); ctx.translate(-cx, -cy);

  if (G.mode==='multiplying'){
    drawCrateGrid(c.gx, c.gy, c.rows, c.cols, G.unit, c.col);
    // product label — one size for every crate, allowed to bleed past small ones
    const label = ''+(c.a*c.b);
    const fs = clamp(W*0.075, 24, 38);
    ctx.font='800 '+Math.round(fs)+'px ui-rounded, system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle='rgba(20,16,10,0.55)';
    rrect(c.gx+c.gw/2-tw/2-8, c.gy+c.gh/2-fs*0.62, tw+16, fs*1.24, 8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label, c.gx+c.gw/2, c.gy+c.gh/2+fs*0.04);
    if (reveal) glow(c.gx, c.gy, c.gw, c.gh);
    if (wrongPulse) redX(c.gx, c.gy, c.gw, c.gh, wrongPulse);
  } else {
    // factoring mode: the answers are fact cards at exactly the
    // conveyor card's size, centered in the slot (whole slot is tappable)
    const s=c.slot;
    const cw2=Math.min(W*0.30, 148, s.w), ch2=Math.min(L.beltH*0.98, cw2*0.88);
    const x0=s.x+(s.w-cw2)/2, y0=s.y+(s.h-ch2)/2;
    ctx.fillStyle='rgba(0,0,0,0.25)';
    rrect(x0+3, y0+4, cw2, ch2, 10); ctx.fill();
    ctx.fillStyle=CARD;
    rrect(x0, y0, cw2, ch2, 10); ctx.fill();
    ctx.strokeStyle=CARDEDGE; ctx.lineWidth=1.5;
    rrect(x0, y0, cw2, ch2, 10); ctx.stroke();
    ctx.save();
    ctx.translate(x0, y0);
    drawFactors(cw2, ch2, c.a, c.b);
    ctx.restore();
    if (reveal) glow(x0, y0, cw2, ch2);
    if (wrongPulse) redX(x0, y0, cw2, ch2, wrongPulse);
  }
  ctx.restore();
}

function cell(x,y,u,col){
  ctx.fillStyle=col[0];
  ctx.fillRect(x+0.5, y+0.5, u-1, u-1);
  ctx.fillStyle=col[1];
  ctx.fillRect(x+0.5, y+0.5, u-1, Math.max(1,u*0.18));   // bevel
  ctx.strokeStyle=col[2]; ctx.lineWidth=1;
  ctx.strokeRect(x+0.5, y+0.5, u-1, u-1);
}
function drawCrateGrid(gx,gy,rows,cols,u,col){
  ctx.fillStyle='rgba(0,0,0,0.28)';
  rrect(gx+3, gy+4, cols*u, rows*u, 4); ctx.fill();
  for (let r=0;r<rows;r++) for (let cI=0;cI<cols;cI++) cell(gx+cI*u, gy+r*u, u, col);
  ctx.strokeStyle=col[2]; ctx.lineWidth=2.5;
  ctx.strokeRect(gx, gy, cols*u, rows*u);
}
function glow(x,y,w,h){
  const p = Math.sin(G.t*8)*0.5+0.5;
  ctx.strokeStyle='rgba(127,224,143,'+(0.5+0.5*p)+')';
  ctx.lineWidth=4+2*p;
  rrect(x-6,y-6,w+12,h+12,10); ctx.stroke();
}
function redX(x,y,w,h,a){
  ctx.strokeStyle='rgba(255,110,95,'+(0.7*a)+')';
  ctx.lineWidth=5; ctx.lineCap='round';
  const m=Math.min(w,h)*0.18, cx=x+w/2, cy=y+h/2;
  ctx.beginPath(); ctx.moveTo(cx-m,cy-m); ctx.lineTo(cx+m,cy+m);
  ctx.moveTo(cx+m,cy-m); ctx.lineTo(cx-m,cy+m); ctx.stroke();
}

/* ---------- the tiling proof ---------- */
function drawTiling(A){
  const total = A.tr*A.tc;
  const sweepT = A.t - A.fly - A.lay;                 // sweep starts after fly+lay
  const prog = clamp(sweepT/A.dur, 0, 1);
  const shown = sweepT<0 ? -1 : Math.floor(prog*total);
  const alpha = A.fade!==undefined ? clamp(A.fade,0,1) : 1;
  const layK = ease(clamp((A.t-A.fly)/A.lay, 0, 1));  // strips sliding to edges
  const cp = animCardPos(A);
  ctx.save();
  ctx.globalAlpha = alpha;

  if (A.tray){
    // pop-up tray backdrop for factoring mode
    ctx.fillStyle='rgba(6,14,20,0.55)';
    ctx.fillRect(0, L.fieldTop-6, W, L.fieldBot-L.fieldTop+12);
    ctx.fillStyle='#e2d4b4';
    ctx.fillRect(A.gx, A.gy, A.cols*A.u, A.rows*A.u);
    ctx.strokeStyle='#7a6642'; ctx.lineWidth=1;
    for(let r=0;r<=A.rows;r++){ ctx.beginPath();ctx.moveTo(A.gx,A.gy+r*A.u);ctx.lineTo(A.gx+A.cols*A.u,A.gy+r*A.u);ctx.stroke(); }
    for(let cI=0;cI<=A.cols;cI++){ ctx.beginPath();ctx.moveTo(A.gx+cI*A.u,A.gy);ctx.lineTo(A.gx+cI*A.u,A.gy+A.rows*A.u);ctx.stroke(); }
    ctx.lineWidth=3; ctx.strokeRect(A.gx, A.gy, A.cols*A.u, A.rows*A.u);
  }

  // the factor strips slide from the card to the crate's edges:
  // one lays out the rows (left edge), the other the columns (top edge)
  const su = Math.max(6, A.u*0.8);
  drawEdgeStrip(true,  A.tc, cp, layK);   // columns along the top
  drawEdgeStrip(false, A.tr, cp, layK);   // rows down the left side

  function drawEdgeStrip(horiz, n, from, k){
    for (let i=0;i<n;i++){
      let tx, ty;
      if (horiz){ tx = A.gx + i*A.u + (A.u-su)/2; ty = A.gy - su - 5; }
      else      { tx = A.gx - su - 5; ty = A.gy + i*A.u + (A.u-su)/2; }
      const fx = from.x - (n*su)/2 + i*su, fy = from.y + 14;
      const x = fx + (tx-fx)*k, y = fy + (ty-fy)*k;
      ctx.fillStyle = horiz ? '#4a7fae' : '#b0693a';
      rrect(x, y, su, su, 2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
      rrect(x, y, su, su, 2); ctx.stroke();
    }
    // strip count label
    if (k>0.95){
      ctx.fillStyle=INK;
      ctx.font='800 '+Math.round(su*1.05)+'px ui-rounded, system-ui, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if (horiz) ctx.fillText(n, A.gx + n*A.u + su*0.9, A.gy - su/2 - 5);
      else       ctx.fillText(n, A.gx - su/2 - 5, A.gy + n*A.u + su*0.9);
    }
  }

  // the order card itself hovers over the crate during the proof
  {
    const cw=Math.max(76, A.u*4), chh=Math.max(34, A.u*1.8);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    rrect(cp.x-cw/2+2, cp.y-chh/2+3, cw, chh, 8); ctx.fill();
    ctx.fillStyle=CARD;
    rrect(cp.x-cw/2, cp.y-chh/2, cw, chh, 8); ctx.fill();
    ctx.strokeStyle='#e8b64c'; ctx.lineWidth=2;
    rrect(cp.x-cw/2, cp.y-chh/2, cw, chh, 8); ctx.stroke();
    ctx.fillStyle=CARDINK;
    ctx.font='800 '+Math.round(chh*0.55)+'px ui-rounded, system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(A.oa+' × '+A.ob, cp.x, cp.y+1);
  }

  // sweep the order's tiles across, row-major
  for (let i=0;i<Math.min(shown+1, total);i++){
    const r=Math.floor(i/A.tc), cI=i%A.tc;
    const inside = r<A.rows && cI<A.cols;
    const x=A.gx+cI*A.u, y=A.gy+r*A.u;
    const fresh = i===shown ? 0.6 : 1;
    if (inside){
      ctx.fillStyle = A.ok ? TILE : 'rgba(255,238,170,'+(0.85*fresh)+')';
      ctx.fillRect(x+1.5, y+1.5, A.u-3, A.u-3);
      ctx.strokeStyle='rgba(120,90,20,0.55)'; ctx.lineWidth=1;
      ctx.strokeRect(x+1.5, y+1.5, A.u-3, A.u-3);
    } else {
      // overflow: tiles hang off the edge in red
      ctx.fillStyle='rgba(255,110,95,0.9)';
      ctx.fillRect(x+1.5, y+1.5, A.u-3, A.u-3);
    }
  }
  // uncovered gaps flash dark once the sweep is done
  if (!A.ok && prog>=1){
    const blink = Math.sin(G.t*14)>0 ? 0.55 : 0.3;
    ctx.fillStyle='rgba(10,10,14,'+blink+')';
    for (let r=0;r<A.rows;r++) for (let cI=0;cI<A.cols;cI++){
      if (r>=A.tr || cI>=A.tc) ctx.fillRect(A.gx+cI*A.u+1, A.gy+r*A.u+1, A.u-2, A.u-2);
    }
  }
  // flash on perfect fit
  if (A.ok && prog>=1){
    const f = clamp(1-(sweepT-A.dur)/0.3, 0, 1);
    ctx.fillStyle='rgba(255,255,255,'+(0.55*f)+')';
    ctx.fillRect(A.gx, A.gy, A.cols*A.u, A.rows*A.u);
  }
  ctx.restore();
}

/* ---------- the ship's hold ---------- */
function drawHold(){
  const g = holdGeom();
  const deckY = L.holdTop+10;
  const waterY = H - (H - L.holdBot)*0.52;
  const keelY = H - 4;
  let dx = 0;
  if (G.scene==='payoff') dx = ease(clamp(G.payT/2.4,0,1)) * W*1.3;

  // sea behind the ship
  ctx.fillStyle=SEA;
  ctx.fillRect(-10, waterY, W+20, H-waterY+10);

  ctx.save();
  ctx.translate(dx, 0);

  // hull: flat deck, curved bow to the right, raked stern to the left
  const bowX = Math.min(W-4, g.x1 + W*0.11);
  const hull = () => {
    ctx.beginPath();
    ctx.moveTo(g.x0-20, deckY);
    ctx.lineTo(g.x1+16, deckY);
    ctx.quadraticCurveTo(bowX+4, deckY+(keelY-deckY)*0.30, bowX-18, keelY-4);
    ctx.lineTo(g.x0+16, keelY-4);
    ctx.quadraticCurveTo(g.x0-4, keelY-10, g.x0-20, deckY);
    ctx.closePath();
  };
  hull();
  ctx.fillStyle='#46586b';                       // steel grey-blue
  ctx.fill();
  ctx.save();                                    // boot stripe + underwater shading
  hull(); ctx.clip();
  ctx.fillStyle='#b0463a';
  ctx.fillRect(g.x0-24, waterY-9, bowX-g.x0+40, 9);
  ctx.fillStyle='rgba(8,30,42,0.55)';
  ctx.fillRect(g.x0-24, waterY, bowX-g.x0+40, keelY-waterY+6);
  // portholes
  ctx.fillStyle='rgba(220,235,245,0.65)';
  for (let px=g.x0+26; px<g.x1; px+=34){
    ctx.beginPath(); ctx.arc(px, deckY+(waterY-9-deckY)*0.55, 3.2, 0, 7); ctx.fill();
  }
  ctx.restore();
  hull();
  ctx.strokeStyle='#5c7186'; ctx.lineWidth=2.5; ctx.stroke();
  // gunwale
  ctx.fillStyle='#5c7186';
  ctx.fillRect(g.x0-20, deckY, g.x1+16-(g.x0-20), 5);

  // bridge superstructure at the stern (left)
  ctx.fillStyle='#eceadf';
  rrect(g.x0-16, deckY-40, 44, 42, 3); ctx.fill();
  ctx.fillStyle='#2a4a63';
  ctx.fillRect(g.x0-11, deckY-34, 34, 9);        // window band
  ctx.fillStyle='#b0463a';                       // funnel
  ctx.fillRect(g.x0+32, deckY-30, 12, 26);
  ctx.fillStyle='#eceadf';
  ctx.fillRect(g.x0+32, deckY-26, 12, 5);
  // bow mast
  ctx.strokeStyle='#5c7186'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(g.x1+6, deckY); ctx.lineTo(g.x1+6, deckY-24); ctx.stroke();
  ctx.fillStyle='#e8b64c';
  ctx.beginPath(); ctx.arc(g.x1+6, deckY-27, 3.5, 0, 7); ctx.fill();

  // hold opening with a yellow coaming
  ctx.fillStyle='#e8b64c';
  ctx.fillRect(g.hx0-4, g.hTop-4, g.hx1-g.hx0+8, g.hBot-g.hTop+8);
  ctx.fillStyle='#141b22';
  ctx.fillRect(g.hx0, g.hTop, g.hx1-g.hx0, g.hBot-g.hTop);

  // cargo: every unit is a coloured cube, stacked bottom-up
  const n = Math.floor(G.fillShown);
  for (let i=0;i<n;i++){
    const row=Math.floor(i/g.cols), col=i%g.cols;
    const y=g.hBot-(row+1)*g.bs;
    if (y < g.hTop) break;
    const ci=((i*2654435761)>>>0)%CRATES.length;
    cell(g.hx0+col*g.bs, y, g.bs, CRATES[ci]);
  }

  // fill notches on the hold wall
  ctx.strokeStyle='rgba(238,244,248,0.35)'; ctx.lineWidth=2;
  for (let i=1;i<4;i++){
    const y=g.hBot-(g.hBot-g.hTop)*i/4;
    ctx.beginPath(); ctx.moveTo(g.hx0, y); ctx.lineTo(g.hx0+10, y); ctx.stroke();
  }
  ctx.restore();

  // water in front of the hull: waves + bow foam
  ctx.strokeStyle=SEA2; ctx.lineWidth=2.5;
  for (let i=0;i<2;i++){
    const wy = waterY + 6 + i*10 + Math.sin(G.t*1.6+i*2)*2;
    ctx.beginPath();
    ctx.moveTo(-6, wy);
    for (let wx=-6; wx<W+6; wx+=16) ctx.quadraticCurveTo(wx+8, wy+4, wx+16, wy);
    ctx.stroke();
  }
  ctx.fillStyle='rgba(220,240,250,0.5)';
  const fx = bowX-16+dx;
  if (fx < W+30){
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(fx+i*7, waterY+2, 4-i, 0, 7); ctx.fill();
    }
  }
}

/* ---------- particles / fx ---------- */
function drawParticles(){
  for (const p of G.parts){
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.fillStyle=p.col;
    ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s);
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
    ctx.strokeRect(-p.s/2, -p.s/2, p.s, p.s);
    ctx.restore();
  }
}
function drawFx(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of G.fx){
    const k = f.t/f.dur;
    if (f.kind==='float'){
      ctx.globalAlpha = 1-k;
      ctx.fillStyle=f.col;
      ctx.font='800 '+Math.round(clamp(H*0.03,18,26))+'px ui-rounded, system-ui, sans-serif';
      ctx.fillText(f.text, f.x, f.y - k*44);
      ctx.globalAlpha = 1;
    } else if (f.kind==='cardDrop'){
      // fulfilled order card arcs down into the hold with its cargo
      const kk = ease(k);
      const tx = W*0.5, ty = L.holdTop + 30;
      const x = f.x + (tx-f.x)*kk;
      const y = f.y + (ty-f.y)*(kk*kk);
      ctx.save();
      ctx.globalAlpha = k>0.8 ? (1-k)/0.2 : 1;
      ctx.translate(x, y); ctx.rotate(kk*1.2); ctx.scale(1-kk*0.45, 1-kk*0.45);
      ctx.fillStyle=CARD;
      rrect(-40,-19,80,38,8); ctx.fill();
      ctx.strokeStyle='#7fe08f'; ctx.lineWidth=2.5;
      rrect(-40,-19,80,38,8); ctx.stroke();
      ctx.fillStyle=CARDINK;
      ctx.font='800 20px ui-rounded, system-ui, sans-serif';
      ctx.fillText(f.a+' × '+f.b, 0, 1);
      ctx.restore();
    } else if (f.kind==='stamp'){
      ctx.globalAlpha = 1-k;
      ctx.fillStyle=GOOD;
      ctx.font='800 '+Math.round(30+k*20)+'px ui-rounded, system-ui, sans-serif';
      ctx.fillText(f.text, f.x, f.y - k*20);
      ctx.globalAlpha = 1;
    } else if (f.kind==='banner'){
      const a = k<0.15 ? k/0.15 : (k>0.8 ? (1-k)/0.2 : 1);
      ctx.globalAlpha = a;
      ctx.fillStyle='rgba(8,16,24,0.7)';
      const y=L.fieldTop + (L.fieldBot-L.fieldTop)*0.5;
      rrect(W*0.08, y-44, W*0.84, 88, 14); ctx.fill();
      ctx.fillStyle=INK;
      ctx.font='800 '+Math.round(clamp(W*0.055,18,28))+'px ui-rounded, system-ui, sans-serif';
      ctx.fillText(f.text, W/2, y-14);
      ctx.fillStyle=DIM;
      ctx.font='600 '+Math.round(clamp(W*0.038,13,18))+'px ui-rounded, system-ui, sans-serif';
      ctx.fillText(f.sub, W/2, y+18);
      ctx.globalAlpha = 1;
    }
  }
}

/* ---------- HUD (minimal) ---------- */
function drawHUD(){
  ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(clamp(H*0.019,12,16))+'px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle=DIM; ctx.textAlign='left';
  ctx.fillText(inPractice() ? 'Practice' : 'Level '+(G.level+1)+' of '+LADDER_LEN[G.pref], 12, L.beltTop*0.5);
  // question progress, centred across the top row
  ctx.font='700 '+Math.round(clamp(H*0.017,11,15))+'px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle='rgba(238,244,248,0.5)'; ctx.textAlign='center';
  ctx.fillText(Math.min(G.lvlN+1, G.lvlTotal)+' / '+G.lvlTotal, W/2, L.beltTop*0.5+1);
  if (G.combo>1){
    const p=Math.min(1,(G.combo-1)/8);
    ctx.fillStyle='rgba(255,'+Math.round(220-90*p)+',120,'+(0.75+0.25*Math.sin(G.t*6))+')';
    ctx.textAlign='right';
    ctx.fillText('combo ×'+G.combo, W-52, L.beltTop*0.5);
  }
}

/* ---------- menu ---------- */
// (the payoff scene shows no banner text: the sail-away animation is
// the moment, and the completion card that follows does the talking)

let menuOrders = null;
function drawMenu(){
  // decorative riders
  if (!menuOrders){
    menuOrders = [{a:4,b:6,p:0.15,st:0,state:'ride'},{a:3,b:7,p:0.55,st:0,state:'ride'}];
  }
  for (const o of menuOrders){
    o.p += 0.00045; if (o.p>1.04) { o.p=-0.15; o.a=ri(2,9); o.b=ri(2,9); }
  }
  G.orders = []; // ensure none linger
  const saveMode = G.mode; G.mode='multiplying';
  for (const o of menuOrders) drawOrder(o);
  G.mode = saveMode;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=INK;
  const tfs = Math.round(clamp(W*0.09,30,52));
  ctx.font='800 '+tfs+'px ui-rounded, system-ui, sans-serif';
  const y2 = H*0.36;
  const titleW = ctx.measureText('Conveyor').width;   // measured in title font
  ctx.fillText('Conveyor', W/2, y2);
  // version tag, quiz-style
  ctx.fillStyle=DIM;
  ctx.font='600 '+Math.round(tfs*0.34)+'px ui-rounded, system-ui, sans-serif';
  ctx.textAlign='left';
  ctx.fillText(APPVER, W/2 + titleW/2 + 10, y2+2);
  ctx.textAlign='center';
  ctx.font='600 '+Math.round(clamp(W*0.042,14,20))+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText('Orders roll in. Tap the crate that matches.', W/2, H*0.445);
  ctx.fillText('Fill the ship before crates fall in the sea!', W/2, H*0.445 + clamp(W*0.06,20,28));

  // mode toggle: easy tables / all tables / hard tables, each carrying
  // its own ladder-progress bar (green + check when complete)
  const gap2=W*0.022, mw=Math.min((W*0.92-gap2*2)/3, 150), mh=clamp(H*0.068,48,60);
  const mx=(W-mw*3-gap2*2)/2, my=H*0.52;
  const modes=[['beginner',MODENAME.beginner,'easy tables'],['regular',MODENAME.regular,'all tables'],['expert',MODENAME.expert,'hard tables']];
  G.modeBtns=[];
  modes.forEach((m,i)=>{
    const x=mx+i*(mw+gap2), sel=G.pref===m[0];
    const prog = clamp((BESTS[m[0]]||0)/LADDER_LEN[m[0]], 0, 1);
    const done = prog>=1;
    G.modeBtns.push({x,y:my,w:mw,h:mh,pref:m[0]});
    ctx.fillStyle = sel ? 'rgba(232,182,76,0.18)' : 'rgba(238,244,248,0.06)';
    rrect(x,my,mw,mh,12); ctx.fill();
    ctx.strokeStyle = sel ? '#e8b64c' : 'rgba(238,244,248,0.25)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    rrect(x,my,mw,mh,12); ctx.stroke();
    ctx.fillStyle = sel ? INK : DIM;
    ctx.font='800 '+Math.round(mh*0.30)+'px ui-rounded, system-ui, sans-serif';
    ctx.fillText(m[1], x+mw/2, my+mh*0.30);
    ctx.font='600 '+Math.round(mh*0.21)+'px ui-rounded, system-ui, sans-serif';
    ctx.fillStyle=DIM;
    ctx.fillText(m[2], x+mw/2, my+mh*0.60);
    // ladder progress bar along the bottom edge
    const px0=x+10, pw=mw-20, py=my+mh-11;
    ctx.fillStyle='rgba(238,244,248,0.15)';
    rrect(px0, py, pw, 4, 2); ctx.fill();
    if (prog>0){
      ctx.fillStyle = done ? '#6cb043' : '#e8b64c';   // mastered green
      rrect(px0, py, Math.max(4, pw*prog), 4, 2); ctx.fill();
    }
    if (done){   // checkmark pinned to the button's corner
      const kx=x+mw-4, ky=my+4;
      ctx.fillStyle='#6cb043';
      ctx.beginPath(); ctx.arc(kx, ky, 7.5, 0, 7); ctx.fill();
      ctx.strokeStyle='#15311e'; ctx.lineWidth=2.2; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(kx-3.4, ky); ctx.lineTo(kx-1, ky+2.8); ctx.lineTo(kx+3.4, ky-2.6);
      ctx.stroke();
    }
  });

  // start button
  const bw=clamp(W*0.5,180,260), bh=clamp(H*0.062,44,56);
  const bx=(W-bw)/2, by=H*0.605;
  G.menuBtn = {x:bx,y:by,w:bw,h:bh};
  const p=Math.sin(G.t*3)*0.5+0.5;
  ctx.fillStyle='#2f8f5b';
  rrect(bx,by,bw,bh,bh/2); ctx.fill();
  ctx.strokeStyle='rgba(127,224,143,'+(0.4+0.5*p)+')'; ctx.lineWidth=3;
  rrect(bx,by,bw,bh,bh/2); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='800 '+Math.round(bh*0.42)+'px ui-rounded, system-ui, sans-serif';
  ctx.fillText('PLAY', W/2, by+bh/2+1);

  drawHold();
}

/* ================================================================
   INPUT
   ================================================================ */
cvs.addEventListener('pointerdown', e=>{
  e.preventDefault();
  audio();
  // map through the canvas's actual on-screen rect so taps always line up,
  // even if the browser stretches the element (iOS toolbar show/hide)
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  const hit=(b)=>b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h;
  if (G.scene==='menu'){
    for (const mb of (G.modeBtns||[])){
      if (hit(mb)){
        G.pref=mb.pref;
        try{ localStorage.setItem('ml-mode', G.pref); }catch(e){}
        sTap();
        return;
      }
    }
    if (hit(G.menuBtn)){ sGood(); startGame(); }
    return;
  }
  if (G.scene==='broken'){
    if (G.brkT <= 0.8) return;              // let the snap play first
    if (hit(G.brkBtn)){ sTap(); retryAfterBreakdown(); return; }
    if (hit(G.brkProg)){ sTap(); showProgress(); return; }
    if (hit(G.brkX)){ sTap(); exitBreakdown(); return; }
    return;
  }
  if (G.scene==='complete'){
    if (G.compShare && hit(G.compShare)){ sTap(); shareNow(gradShareInfo(G.pref)); return; }
    if (hit(G.compX)){ sTap(); G.orders=[]; G.parts=[]; G.fx=[]; G.cands=[]; G.scene='menu'; return; }
    if (hit(G.compProg)){ sTap(); showProgress(); return; }   // closing it returns here
    if (G.compMove && hit(G.compMove)){
      sTap();
      G.pref = NEXTMODE[G.pref];
      try{ localStorage.setItem('ml-mode', G.pref); }catch(e){}
      startGame();   // fresh belt in the new mode
      return;
    }
    if (hit(G.compNext)){ sTap(); startLevel(true); G.scene='play'; }
    return;
  }
  if (G.scene!=='play' || G.phase!=='aim') return;
  for (const c of G.cands){
    if (c.gone) continue;
    const s=c.slot;
    if (x>=s.x-6 && x<=s.x+s.w+6 && y>=s.y-6 && y<=s.y+s.h+6){
      tapCandidate(c);
      return;
    }
  }
}, {passive:false});

/* ================================================================
   GO
   ================================================================ */
const creditEl = document.getElementById('credit');
const chartEl = document.getElementById('chart');
// in-game the X quits to the loader's own title; from the title it exits to the menu
document.getElementById('exit').addEventListener('click', e=>{
  if (G.scene!=='menu'){
    e.preventDefault();
    G.orders=[]; G.parts=[]; G.fx=[]; G.cands=[]; G.anim=null;
    G.phase='aim'; G.scene='menu';
  }
});
chartEl.addEventListener('click', ()=>{ audio(); sTap(); showProgress(); });
const shareEl = document.getElementById('share');
shareEl.addEventListener('click', ()=>{ audio(); sTap(); shareNow(); });
const exitEl = document.getElementById('exit');
setInterval(()=>{
  const onMenu = G.scene==='menu';
  const onCard = G.scene==='complete' || G.scene==='broken';
  creditEl.style.display = onMenu ? 'block' : 'none';
  chartEl.style.display = (onMenu && ST.h.length) ? 'block' : 'none';
  shareEl.style.display = onMenu ? 'block' : 'none';   // shareable from day one
  // cards carry their own in-card X; the screen-corner one hides meanwhile
  exitEl.style.display = onCard ? 'none' : 'block';
}, 250);
resize();
requestAnimationFrame(frame);
</script>
